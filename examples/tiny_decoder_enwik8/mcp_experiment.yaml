# MCP-safe variant of the full tiny Enwik8 decoder sweep.
#
# MCP requires absolute workdir and storage paths so detached runs survive restarts and arbitrary client working directories. The catalog pins cwd to the repository root because the trainer command below is intentionally repo-relative.

experiment: tiny_decoder_enwik8_hparams_mcp
storage: sqlite:////tmp/phasesweep-mcp-tiny-decoder-enwik8/phases.db
provenance:
  trainer: "run-trial-v2+decoder-template@9c90a551"
  data: "enwik8-template-download"
workdir: /tmp/phasesweep-mcp-tiny-decoder-enwik8/runs
trial_command: "python examples/tiny_decoder_enwik8/run_trial.py --template-root examples/tiny_decoder_enwik8/upstream --config {config_path}"
trainer_config:
  run_dir: "{trial_dir}/trainer"
  num_tokens: 256
  dim: 128
  depth: 4
  heads: 4
  dim_head: 32
  tied_embedding: true
  ffn_dim_multiplier: 1.0
  flash_attn: true
  compile: false
  use_autocast: true
  num_batches: 1000
  batch_size: 4
  grad_accum_every: 1
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  data_path: data/enwik8.gz
  seq_len: 128
  validate_every: 100
  val_batches: 5
  generate_every: 1000000
  save_every: 1000000
  temperature: 1.0
  min_p: 0.1
  seed: 7
env:
  CUDA_DEVICE_ORDER: PCI_BUS_ID

metric:
  name: val_loss
  goal: minimize
  extractor:
    type: json_envelope
    path: result.json
    objective_name: val_loss
    split: validation
    policy: final_checkpoint
    checkpoint: final.pt
    expected_step: 1000

phases:
  - name: optimizer_scale
    comment: "First choose learning rate, the dominant optimizer-scale decision, while keeping the decoder architecture fixed."
    n_trials: 3
    sampler:
      type: grid
    search_space:
      learning_rate: { type: categorical, choices: [0.0003, 0.001, 0.003] }

  - name: weight_decay
    comment: "With optimizer scale locked, tune Adam weight decay as the regularization pass."
    inherits: [optimizer_scale]
    n_trials: 3
    sampler:
      type: grid
    search_space:
      weight_decay: { type: categorical, choices: [0.0, 0.0001, 0.001] }

  - name: clip_norm
    comment: "With scale and regularization locked, tune gradient clipping as the final stability/control pass."
    inherits: [weight_decay]
    n_trials: 3
    sampler:
      type: grid
    search_space:
      grad_clip_norm: { type: categorical, choices: [0.5, 1.0, 2.0] }

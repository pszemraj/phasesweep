# MCP variant of the toy example. It keeps its outputs and ledger under /tmp scratch paths, apart from the CLI example's checkout-local runs.

experiment: tiny_lm_16mb_mcp
storage: journal:////tmp/phasesweep-mcp-tiny-lm/phases.journal
provenance:
  revision: "phasesweep-fake-trainer-v1"
workdir: /tmp/phasesweep-mcp-tiny-lm/runs
trial_command: "python -m phasesweep.examples.fake_train --config {config_path}"
trainer_config:
  model:
    n_layers: 8
    dropout: 0.1
  optimizer:
    lr: 0.0003
    weight_decay: 0.05

metric:
  name: eval_loss
  goal: minimize
  extractor:
    type: json_envelope
    path: result.json
    objective_name: eval_loss
    split: validation
    policy: synthetic
    checkpoint: toy_formula
    expected_step: 100

constraints:
  - name: param_bytes
    extractor:
      type: json
      path: result.json
      key: param_bytes
    max: 16777216

phases:
  - name: depth
    comment: "Settle on a network depth before tuning anything else."
    n_trials: 4
    sampler:
      type: grid
    search_space:
      model.n_layers: { type: categorical, choices: [4, 8, 12, 16] }

  - name: lr
    comment: "With depth locked, find the learning rate."
    inherits: [depth]
    n_trials: 12
    sampler:
      type: tpe
      seed: 0
      n_startup_trials: 4
    search_space:
      optimizer.lr: { type: float, low: 1.0e-5, high: 1.0e-2, log: true }

  - name: regularization
    comment: "Last, jointly tune weight_decay and dropout because they interact."
    inherits: [lr]
    n_trials: 16
    sampler:
      type: cmaes
      seed: 1
    search_space:
      optimizer.weight_decay: { type: float, low: 0.0, high: 0.3 }
      model.dropout: { type: float, low: 0.0, high: 0.3 }

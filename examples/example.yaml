# Minimal starting experiment: one packaged toy-trainer attempt, no remote logging.
# Validate: phasesweep validate examples/example.yaml
# Run from the checkout root: phasesweep run examples/example.yaml
# Every accepted key and default is in docs/config_reference.yaml.
# This disposable study is sufficient to check the trainer boundary; choose
# durable storage and meaningful provenance before planning resumable work.
experiment: first_trial
trial_command: "python -m phasesweep.examples.fake_train --config {config_path}"
metric:
  extractor:
    type: json_envelope
    objective_name: eval_loss
    split: validation
    policy: synthetic
phases:
  - name: baseline
    n_trials: 1
    # The toy trainer is CPU-only; GPU isolation would reserve hardware needlessly.
    gpu_policy: none

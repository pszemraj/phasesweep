# Example MCP catalog. Start the server with:
#   phasesweep mcp serve --catalog examples/catalog.yaml
#
# The MCP-specific config below uses absolute scratch paths under /tmp. Only the regular CLI example in experiment.yaml is checkout-local; its relative paths resolve against its own directory.
# The agent selects an experiment `id` from this catalog and uses the returned `run_id` for lifecycle calls. It cannot pass a path, author a config through the server, or override trial_command / env / storage / workdir. You curate which experiments exist by editing this file (same trust as the experiment YAML).

state_dir: /tmp/phasesweep-mcp-tiny-lm/state          # run handles + per-run logs (operator-owned)
max_concurrent_runs: 1          # sweeps at once across all experiments; 1 keeps a single GPU sane
experiments:
  - id: tiny-lm                 # used for discovery, inspection and launch
    config: ./mcp_experiment.yaml   # resolved relative to this catalog
    visible_params: all         # toy example values are safe to show; production defaults to redacted
    description: "16 MB LM: pick depth, then lr, then regularization"
    allow:
      launch: true              # side effects default false; opt in deliberately
      cancel: true
      from_phase: true

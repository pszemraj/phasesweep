name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Exact versions, so CI and the dev extra in pyproject.toml lint and type-check
      # with the same tools; raise ruff, mypy and types-PyYAML in both places together.
      - name: Install static-check dependencies
        run: >-
          python -m pip install
          'ruff==0.15.21' 'mypy==2.3.0' 'types-PyYAML==6.0.12.20260518'
          'optuna==4.9.0' 'cmaes==0.13.0'
          'pydantic==2.13.4' 'pyyaml==6.0.3' 'click==8.4.2' 'mcp==1.27.2'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Pytest collects the whole suite before selecting the tests marked
      # `contract`; keep this step within the approved test budget.
      - name: Contract tests
        run: |
          bash scripts/check_module_size.sh
          python -m pip install 'pytest==9.1.1'
          PYTHONPATH=src pytest -p no:cacheprovider -m "contract and not live"

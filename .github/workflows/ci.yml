name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Every package installed here has an exact version, so a new release of one
      # of them cannot change what passes; the packages they depend on still float.
      # The dev extra in pyproject.toml pins the same ruff, mypy and types-PyYAML;
      # raise them in both places together.
      - name: Install static-check dependencies
        run: >-
          python -m pip install
          'ruff==0.15.21' 'mypy==2.3.0' 'types-PyYAML==6.0.12.20260518'
          'optuna==4.9.0' 'cmaes==0.13.0'
          'pydantic==2.13.4' 'pyyaml==6.0.3' 'click==8.4.2' 'mcp==1.27.2'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Keep collection and in-process contracts within the approved test budget.
      - name: Contract tests
        run: |
          bash scripts/check_module_size.sh
          python -m pip install 'pytest==9.1.1'
          PYTHONPATH=src python -m pytest --collect-only -q -p no:cacheprovider
          PYTHONPATH=src python -m pytest -p no:cacheprovider \
            tests/test_ledger_contract.py tests/test_error_routing.py \
            tests/test_ledger_read_paths.py

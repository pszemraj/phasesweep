name: PR9 acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install declared development dependencies
        run: python -m pip install -e '.[dev,wandb]' 'optuna==4.9.0'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: scripts/check_installed_wheel.sh

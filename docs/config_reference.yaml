# PhaseSweep configuration reference
#
# This is a hand-written per-key contract, not a config template. Every line is commented so the file cannot be mistaken for a runnable experiment or suite.
# A UTF-8 YAML mapping with a top-level `suite` key is parsed as a Suite; any other top-level mapping is parsed as an Experiment.
# Unknown keys are rejected in every object. Duplicate YAML mapping keys are rejected at every depth.
# Standard YAML merge keys are accepted; an explicit key may override the value inherited from an anchor.
# `required` means the key must be present. Otherwise the displayed `= value` is the default, and `| None` means YAML null is accepted subject to the stated interactions.

# EXPERIMENT ROOT

# experiment: str (required)
# Nonempty ASCII `[A-Za-z0-9_-]+`; selects output paths, locks, and `<experiment>::<phase>` Optuna study names.

# storage: str | None = null
# `auto` resolves to an absolute URL for <workdir>/<experiment>/study.db, or study.journal when any phase has n_jobs > 1. The starter uses auto; omitted storage still defaults to null.
# Auto is persistent: provenance must be nonempty, tpe/random/cmaes phases require seed, and tpe/cmaes also require acknowledge_nonresumable: true. Grid needs neither.
# Changing n_jobs across the SQLite/journal boundary changes auto's database identity; an existing artifact tree is rejected, not migrated. Use a new experiment name or keep an explicit compatible backend.
# `null`, `:memory:`, `sqlite://`, `sqlite:///:memory:`, and SQLite `uri=true` targets using `mode=memory` create fresh in-memory studies. Trial numbers, study state, and the current winner/summary view restart on every invocation; use persistent storage for resumable work.
# `sqlite:///...` is persistent only with every phase at `n_jobs: 1`; `journal:///...` supports same-host parallel trials; other URLs (RDB backends such as postgresql:// or mysql://) pass through to Optuna but are rejected at config validation unless allow_external_rdb_single_host: true is also set.
# RDB identity ignores authentication plus driver, encryption, and timeout settings. Nested `odbc_connect` target keys are case-insensitive and order-independent; each target selector may appear only once.
# Three-slash SQLite/Journal paths are relative to the invocation cwd; absolute POSIX paths use four slashes.
# Auto URLs use escaped file: URI filenames with uri=true, preserving punctuation and Unicode for both SQLite and journal storage. Experiment.storage retains the authored value; Experiment.resolved_storage returns the effective URL.

# allow_external_rdb_single_host: bool = false
# Acknowledges the loss of PhaseSweep's host-local-filesystem-based coordination (locks, generation pointers) when using a shared RDB storage backend. Set true only when every process that will ever touch this storage and workdir runs on a single host.

# workdir: str = "./runs"
# Output root for trial artifacts, winners, and summaries. Relative paths resolve from the invocation cwd, not the config file.
# Newly created workdirs contain a .gitignore with *; existing directories and ignore files are untouched.
# With persistent storage each phase study is bound to the one resolved <workdir>/<experiment> root it publishes into, so re-running the same config against a second workdir is refused instead of producing a divergent second result tree. Keep it stable across resumptions; if you genuinely relocate the artifact tree, move it first and then run `phasesweep rebind-workdir CONFIG`.

# trial_command: str (required)
# Shell command for one trial. Supported format fields are `{config_path}`, `{overrides}`, `{overrides_path}`, `{trial_dir}`, `{trial_id}`, `{phase}`, and `{run_name}`; path-like substitutions and rendered override tokens are shell-quoted.
# Config loading checks format syntax, supported fields, and the exact generated payload for yaml_file/json_file, but not executable/path existence, trainer parser compatibility, or evidence production.
# The default yaml_file mode always requires `{config_path}`. An override-free compatibility-format phase may use a constant command; any inherited, contract, fixed, or sampled override requires `{overrides}` for argparse/hydra or `{overrides_path}` for json_file.

# trainer_config: dict[str, Any] = {}
# The trainer's base configuration, embedded in this same operator-authored YAML. In the default yaml_file mode, PhaseSweep deep-copies it per trial, applies the composed dotted-path overrides, writes the complete result to `<trial_dir>/trainer_config.yaml`, and substitutes that path into `{config_path}`.
# Keys at every mapping level must be strings. Values may be strings, booleans, integers, finite floats, null, lists, or nested mappings; quote YAML dates/timestamps to keep them strings. Generated YAML is deterministic (sorted mapping keys). Validation and dry-run compose and serialize the payload without writing the file.
# String values in this mapping may contain `{trial_dir}`, `{trial_id}`, `{phase}`, or `{run_name}`; those runtime placeholders expand before overrides are applied. Override-supplied strings remain literal. A dotted override creates missing mappings and replaces the final value, but cannot descend through an existing scalar or list.
# This complete mapping joins experiment and phase fingerprints. A nonempty trainer_config with argparse, json_file, or hydra is rejected because those explicit compatibility formats would ignore it.

# provenance: dict[str, str] = {}
# Operator-declared identities for trainer code, data, dependencies, container, tokenizer, or other inputs outside this YAML. The embedded trainer_config is already fingerprinted. Keys and values must contain non-whitespace text.
# Persistent storage requires at least one entry. The complete mapping is included in semantic fingerprints; update its values whenever an external input changes. PhaseSweep does not inspect imports or hash arbitrary trial_command inputs.

# override_format: Literal["yaml_file", "argparse", "json_file", "hydra"] = "yaml_file"
# `yaml_file` is the core, default, and `phasesweep init` workflow. It requires `{config_path}` and uses trainer_config as described above; it never emits per-key CLI tokens and does not require Hydra.
# `argparse` is explicit compatibility for an existing flag parser. It requires `{overrides}` and emits `--key value`; booleans are lowercase, null is `None`, and lists are bracketed (`[1,a,false]`). Values must be null, booleans, integers, finite floats, strings, or lists of those; mappings and other YAML-native types (dates, datetimes, `.nan`/`.inf`) are rejected at config load because only that set has one canonical wire form.
# `json_file` is explicit overrides-only compatibility. It requires `{overrides_path}`, preserves JSON types, and expands dotted keys into `<trial_dir>/overrides.json`; it does not include trainer_config. Validation and dry-run do not write that file, but config loading runs every statically known contract and phase fixed value through the exact strict serializer used at launch. Values sampled from the closed parameter types are JSON-safe by construction.
# `hydra` is compatibility support for an existing Hydra/OmegaConf entry point; PhaseSweep does not depend on Hydra or perform its config composition. It requires `{overrides}` and emits `key=value`; it accepts the same null/boolean/integer/finite-float/string/list value grammar as argparse and rejects mappings, YAML-native dates/datetimes, and `.nan`/`.inf` during config load.
# Contract and phase fixed_overrides are validated at config load against the selected format's value grammar; yaml_file uses the portable trainer_config domain above.

# metric: Metric (required)
# Metric object keys:
#   name: str = "objective"
#   Must be distinct from every constraints[].name.
#   goal: Literal["minimize", "maximize"] = "minimize"
#   Sets Optuna direction and the sign used by promotion.min_delta.
#   extractor: ObjectiveExtractor (required)
#   Accepts json_envelope, log_regex, or wandb. Plain json is not a primary-objective extractor because it cannot prove attempt identity. The extracted value must be finite or the trial fails. Extractor shapes are defined below.

# constraints: list[Constraint] = []
# Each Constraint object has these keys:
#   name: str (required)
#   Must be distinct from metric.name and every other constraint name.
#   extractor: Extractor (required)
#   Extraction failure or a non-finite value fails the trial; Extractor shapes are defined below.
#   min: float | None = null
#   max: float | None = null
#   At least one finite inclusive bound is required and min must be <= max. A finite violation completes the trial as infeasible, prevents it from winning, and counts toward max_consecutive_failures; current samplers still receive its objective without feasibility guidance.

# contracts: dict[str, Contract] = {}
# Mapping names are referenced verbatim by phases[].contracts. Each Contract object has these keys:
#   fixed_overrides: dict[str, Any] = {}
#   Keys use the override-key grammar documented on phases[].fixed_overrides. Applied contract values override inherited values and are immutable within that phase.
#   gates: list[Gate] = []
#   Evaluated before phase-local gates. Gate shapes are defined below.

# phases: list[Phase] (required; min length 1)
# Phase names must be unique and are evaluated in declaration order. Each Phase object accepts the following keys.

# PHASE OBJECT (each entry nested under `phases`)
# Phase fingerprints exclude these run-control fields: comment, n_trials, n_jobs, gpu_ids, gpu_devices, allow_no_gpu_isolation, max_consecutive_failures, allow_unbounded_trials, timeout_seconds_per_phase, allow_incomplete_on_timeout, allow_partial_grid, allow_seed_search, and sampler.acknowledge_nonresumable. Their individual safety rules still apply; other phase fields are semantic unless stated otherwise.

# name: str (required)
# Nonempty ASCII `[A-Za-z0-9_-]+`; used in paths and Optuna study names.

# comment: str | None = null
# Design note shown by `validate` and `show-winners`. It has no trial-runtime effect and is excluded from phase fingerprints, but suite generations retain it in their historical plan identity.

# inherits: list[str] = []
# Names prior phases whose exposed `effective_overrides` become the lowest-priority override layer; forward references are rejected.
# Inherited keys cannot be sampled again. An exact collision from multiple parents requires a local fixed_overrides value; dotted parent/subkey collisions cannot be resolved and are rejected.

# fixed_overrides: dict[str, Any] = {}
# Values applied to every trial after inherited and contract values but before sampled values. A local fixed value may deliberately reset an inherited exact key, but cannot replace an applied contract key or share a key with search_space.
# Every key is a nonempty dotted path of `[A-Za-z0-9_-]+` segments. Across inherited, contract, fixed, and sampled keys, a key and its prefix (such as a scalar parent plus a nested child) cannot coexist.

# contracts: list[str] = []
# Names from top-level contracts. Unknown names are rejected; two applied contracts cannot define the same fixed key, and contract fixed keys cannot collide with local fixed or sampled keys.

# search_space: dict[str, SearchParam] = {}
# Empty is valid for repeated fixed-configuration trials. Nonempty keys use the same dotted override-key grammar as fixed_overrides; values use one SearchParam shape defined below.
# Keys named `seed` or ending in `.seed` require allow_seed_search: true.

# n_trials: int (required; >= 1)
# Monotonic target number of terminal attempts in this phase's study; COMPLETE, FAIL, and PRUNED trials all count. Persistent random/grid reruns launch only the remaining top-up. Lowering an accepted target is rejected; use a new experiment name for a smaller study.
# Once any phase that depends on this one has a study, increasing this phase's target is rejected before launch because that dependent is already bound to its published winner. A dependency is either `inherits` or `promotion.min_delta_vs`, direct or transitive through a mix of the two. This applies even if the added trials might leave the winner unchanged; use a new experiment name for a larger upstream budget.
# For a full grid, set this to the grid cardinality; a smaller value requires allow_partial_grid: true.

# n_jobs: int = 1 (>= 1)
# Maximum concurrent trials inside one orchestrator. SQLite rejects values > 1; a smaller GPU pool can serialize trainer launches below this number.
# TPE enables its parallel constant-liar heuristic when this is > 1. TPE/CMA-ES cross-invocation top-ups are rejected because their process-local continuation state is not fully durable.

# gpu_policy: Literal["single_per_trial", "whole_node", "none"] = "single_per_trial"
# `single_per_trial` leases one detected/configured CUDA-visible token per active trainer; a single-job phase with no visible GPU runs without isolation.
# `whole_node` requires n_jobs: 1 plus an explicit gpu_ids or gpu_devices list, and leases every configured token for the trainer. `none` acquires no GPU locks, forbids gpu_ids/gpu_devices, and with n_jobs > 1 requires allow_no_gpu_isolation: true.
# gpu_policy is semantic: changing it invalidates reuse of an existing persistent phase study. Under whole_node the device-set SIZE is semantic too (it is the trainer's world size); which tokens spell the set remains run-control.

# gpu_ids: list[int] | None = null
# If set, a nonempty list of non-negative CUDA indices. Mutually exclusive with gpu_devices and forbidden by gpu_policy: "none". Under single_per_trial, duplicates are removed in first-seen order; under whole_node they are rejected at config load, because the effective device count is the trainer's world size and therefore part of experiment semantics.
# If both explicit lists are null, PhaseSweep uses top-level env.CUDA_VISIBLE_DEVICES when present, otherwise ambient CUDA_VISIBLE_DEVICES, otherwise nvidia-smi detection. Numeric and GPU/MIG UUID tokens from any of these sources must resolve through nvidia-smi. If ambient tokens cannot be resolved while /proc/driver/nvidia/gpus reports hardware, PhaseSweep fails closed instead of silently pinning trials to CPU; allow_no_gpu_isolation: true is the explicit escape hatch. An explicit empty string or `-1` exposes no devices and suppresses auto-detection.

# gpu_devices: list[str] | None = null
# If set, a nonempty list of CUDA_VISIBLE_DEVICES tokens, including GPU/MIG UUIDs. Tokens are stripped, cannot be empty, contain commas, or equal `-1`. Every token must resolve through nvidia-smi; GPU/MIG aliases are rebound to the inventory's canonical spelling before launch. Under single_per_trial tokens are deduplicated in first-seen order, including two spellings of one physical GPU that resolution collapses at pool creation. Under whole_node duplicates are rejected instead: repeated tokens and aliases for one physical GPU fail closed because the effective device count is the trainer's world size and therefore part of experiment semantics. A whole_node set containing MIG must contain exactly one token because CUDA cannot guarantee that a larger MIG token count equals the enumerated device count.
# Mutually exclusive with gpu_ids and forbidden by gpu_policy: "none".

# allow_no_gpu_isolation: bool = false
# Set true only for intentional CPU-only parallel trials or an external scheduler that already isolates devices. Required when n_jobs > 1 has no detectable GPU tokens and no explicit CUDA-disable value, and when gpu_policy is "none" with n_jobs > 1.

# max_consecutive_failures: int = 5 (>= 1)
# Stops scheduling after this many consecutive failed or infeasible results; a feasible result resets the count. Completion order and the current streak are durable across supported random/grid top-ups and process restarts, and a stale RUNNING trial reaped as FAIL counts as a failure. Already-running parallel peers may still finish after the threshold is reached.
# An identical rerun after an abort remains failed. For random/grid phases, raise n_trials above the aborting invocation's accepted target to explicitly start a new recovery streak; use a new experiment name for stateful samplers or when you do not want to reuse the prior study.
# Raise only when failures are expected and informative; the default catches broken trainer/evidence contracts early.

# sampler: Sampler = {}
# Sampler object keys:
#   type: Literal["tpe", "random", "grid", "cmaes"] = "tpe"
#   `grid` rejects log parameters, requires float steps, and requires n_trials to equal cardinality unless allow_partial_grid is true. `cmaes` rejects categorical parameters and requires the installed `cmaes` dependency.
#   seed: int | None = null  # 0 <= seed <= 2**32 - 1
#   Seed for sampler behavior within one invocation; grid uses it for traversal order. Seeded random draws are keyed by durable trial identity so supported top-up batching does not restart the stream. TPE/CMA-ES top-ups are rejected rather than described as reproducible across process boundaries.
#   Required when storage is persistent and type is `tpe`, `random`, or `cmaes`: a durable study outlives the process that created it, so an unseeded stochastic draw leaves trials nobody can reproduce. `grid` is exempt. In-memory storage is exempt entirely and keeps the whole sampler block optional.
#   n_startup_trials: int = 10 (>= 0)
#   Used only by TPE; ignored by random, grid, and CMA-ES.
#   acknowledge_nonresumable: bool = false
#   Required to be true when storage is persistent and type is `tpe` or `cmaes`. It states that this phase's trial target runs in one invocation: those samplers hold process-local state Optuna storage does not persist, so an interrupted phase cannot be resumed mid-target and n_trials cannot be raised later. Rejected for `grid` and `random`, which resume safely, and unnecessary on in-memory storage. Run-control, not semantics: unlike the rest of the sampler block it is excluded from the phase fingerprint, so acknowledging an existing study does not invalidate it.

# timeout_seconds_per_trial: float | None = 86400.0 (>= 0 and finite when set)
# Bounds the trainer process group; `0` is an immediate timeout, not disabled. `null` disables this guard only when allow_unbounded_trials is true.
# This field is semantic: changing it invalidates reuse of an existing persistent phase study.

# allow_unbounded_trials: bool = false
# Set true only to permit timeout_seconds_per_trial: null. It has no effect while a finite trial timeout is configured.

# timeout_seconds_per_phase: float | None = null (>= 0 and finite when set)
# Per-invocation wallclock budget for this phase's GPU waits, supervisor/trainer work, metric and constraint extraction, and evidence gates. Enforcement is cooperative at stage boundaries, so one blocking local stage or process-cleanup grace may finish after the deadline, but evidence completed late is rejected; W&B polling is capped to the remaining budget.
# This run-control field is excluded from the semantic fingerprint.

# allow_incomplete_on_timeout: bool = false
# When a phase/run deadline leaves fewer than n_trials terminal attempts, false rejects partial winner selection; true permits a winner only if at least one feasible COMPLETE trial exists.
# It does not rescue an ordinary per-trial timeout. Timeout handling takes precedence over max_consecutive_failures, and a persisted incomplete winner can be resumed only while this remains true.

# allow_partial_grid: bool = false
# False requires n_trials to equal the concrete grid cardinality; true permits a budget from 1 through cardinality. Used only with sampler.type: "grid" and excluded from the semantic fingerprint.

# allow_seed_search: bool = false
# False rejects search_space keys named `seed` or ending in `.seed`; set true only for an explicit variance audit. Excluded from the semantic fingerprint.

# gates: list[Gate] = []
# Contract gates run first, then this list. A failed gate fails the trial unless this phase has promotion.requires_gates: false, in which case the result is recorded as advisory. Suite-study promotion is applied later and cannot make component gates advisory.
# Gate shapes are defined below.

# promotion: Promotion | None = null
# Compares this phase's candidate winner with a prior exposed phase winner before exposing it downstream. Promotion keys and outcomes are defined below.

# EXPERIMENT ROOT, continued

# timeout_seconds_per_run: float | None = null (>= 0 and finite when set)
# Per-invocation experiment budget shared across phases. Like the phase budget, it covers GPU waits, supervisor/trainer work, extraction, and gates; enforcement is cooperative at stage boundaries, and W&B polling is capped to the remaining budget.
# This field is outside semantic fingerprints; allow_incomplete_on_timeout remains a per-phase opt-in.

# env: dict[str, str] = {}
# Applied over the ambient variables selected by execution.inherit_env and execution.passthrough_env. Configured values are always semantic, even when a key also appears in passthrough_env. PhaseSweep then overwrites `PHASESWEEP_TRIAL_DIR`, `PHASESWEEP_TRIAL_ID`, `PHASESWEEP_PHASE`, `PHASESWEEP_RUN_NAME`, `PHASESWEEP_GENERATION_ID`, `PHASESWEEP_ATTEMPT_ID`, `PHASESWEEP_OVERRIDES_SHA256`, and `WANDB_RUN_ID` for every trial. A json_envelope metric also receives `PHASESWEEP_OBJECTIVE_PATH`, the absolute destination resolved from its configured path; other extractor types remove any ambient value with that name.
# The historically named PHASESWEEP_OVERRIDES_SHA256 is the digest of the exact PhaseSweep-written trainer input: the complete trainer_config.yaml in default mode, overrides.json in JSON compatibility mode, or overrides_resolved.json in a CLI compatibility mode.
# WANDB_RUN_ID equals the immutable attempt ID; W&B extractors and gates query that ID instead of a display name.
# An active GPU assignment also overwrites CUDA_VISIBLE_DEVICES. If any assigned token is numeric, CUDA_DEVICE_ORDER is forced to PCI_BUS_ID so the trainer uses the physical card covered by the nvidia-smi-derived host lock; UUID/MIG-only assignments preserve an explicitly configured order.

# execution: ExecutionContext = {}
# Explicit trainer execution contract; `cwd`, `inherit_env`, and the passthrough_env classification join the semantic fingerprint, so changing any of them invalidates populated resumable studies (`record_env` does not - it changes only what is written). ExecutionContext keys:
#   cwd: str | None = null
#   Trainer working directory, resolved (expanduser + resolve) at launch; the resolved path must be a directory or the trial fails. Null uses the orchestrator's invocation directory, whose resolved path still joins the semantic fingerprint and is frozen into each generation config snapshot. When set for an MCP catalog entry, the path must be absolute.
#   inherit_env: Literal["all", "none"] | list[str] = "all"
#   Semantic ambient variables the trainer inherits. "all" copies the full parent environment; "none" keeps only PATH, HOME, LANG, LC_ALL, TMPDIR, USER, LOGNAME, and TZ; a list of names adds variables that exist in the parent environment to that base set. Missing names are omitted, not errors. List names must be nonempty, unpadded, and unique. Before allocating a trial in a populated persistent study, PhaseSweep requires the current semantic values to match every recorded trial's cohort digest.
#   Prefer "none" or a bounded list for persistent studies. "all" hashes every unclassified ambient value into shared study attributes, so credentials must be named under passthrough_env instead.
#   passthrough_env: list[str] = []
#   Ambient credential or transport variables inherited in addition to a narrowed inherit_env contract. Their values are excluded from the semantic cohort digest so tokens may rotate, while their sorted names and classification remain fingerprinted. Names must be nonempty, unpadded, unique, and must not overlap a list-valued inherit_env. A same-named top-level env entry remains semantic and cannot be exempted here.
#   record_env: bool = false
#   Write the composed base environment to `environment.json` before PhaseSweep's per-trial and GPU variables are injected (semantic digest, inherit_env and passthrough_env contracts, and every base name-value pair). Off by default because those values include secrets; the file is owner-only (0600). Independently of this flag, every trial records the semantic environment's SHA-256 digest plus all sorted base names as trial attributes, and the winner records the digest plus inherit_env; pass-through values are not persisted in study attributes.

# SEARCH PARAMETER OBJECTS
# A search_space value must use exactly one discriminator shape.

# type: Literal["float"] (required)
# low: float (required; finite)
# high: float (required; finite and >= low)
# log: bool = false
# step: float | None = null (finite and > 0 when set)
# log: true requires low > 0 and forbids step. Grid rejects log and requires step to divide high - low evenly.

# type: Literal["int"] (required)
# low: int (required)
# high: int (required; >= low)
# log: bool = false
# step: int = 1 (> 0)
# log: true requires low > 0 and step: 1. Grid rejects log.

# type: Literal["categorical"] (required)
# choices: list[None | bool | int | finite float | str] (required; min length 1)
# Lists, mappings, objects, NaN, and infinities are rejected. CMA-ES rejects categorical parameters.
# Choices must be pairwise unequal under plain Python comparison, so `[1, 1.0]`, `[1, true]`, and `[0, false]` are rejected alongside a literal repeat. Optuna records a sampled value as its `==` index into `choices`, so equal choices collapse onto the first of them in the published winner and in every inherited override; a repeat also inflates grid cardinality and skews sampling weights. With a CLI compatibility format, choices must also have distinct rendered wire values (`[1, "1"]` is ambiguous under argparse); yaml_file and json_file preserve their distinct numeric/string types.

# EXTRACTOR OBJECTS
# An extractor or gate must use exactly one discriminator shape. Every file-backed `path`/`file` below is a nonempty trial-relative file path: absolute paths, any `..` component, NUL bytes, and `.` (the trial directory itself) are rejected. The one exception is an artifact_size gate with source: directory, where path: . intentionally measures the complete trial directory.
# Every JSON `key` is a nonempty dotted lookup path with no empty segment. Extractor runtime failures fail the trial.

# type: Literal["json"] (required)
# path: str (required)
# key: str (required)
# Constraint-only scalar extractor. The selected JSON value must be a finite JSON number; strings and booleans are rejected.

# type: Literal["json_envelope"] (required)
# path: str = "result.json"
# objective_name: str (required; nonempty)
# split: str (required; nonempty)
# policy: str (required; nonempty)
# checkpoint: str | None = null (nonempty when set)
# expected_step: int | None = null (>= 0)
# Requires schema_version=1, status=complete, matching generation/attempt IDs and resolved-overrides digest, a numeric objective value with the configured name/split, and evaluation metadata with the configured policy. Every envelope must identify a checkpoint and non-negative step; checkpoint and step are matched exactly when configured. Python trainers may call `phasesweep.report_objective(...)`; it fills the managed identity, creates missing parent directories for a nested configured path, writes to `PHASESWEEP_OBJECTIVE_PATH`, and atomically replaces the envelope.

# type: Literal["log_regex"] (required)
# file: str = "stdout.log"
# stdout.log and stderr.log are captured automatically; another relative path may name a trainer-written log.
# pattern: str (required)
# Python regex with a named `(?P<value>...)` group. Invalid regex, a missing group, or no numeric match fails the trial.
# select: Literal["last", "first", "min", "max"] = "last"
# `first` stops matching at the first numeric match; every mode still reads the whole file so the frozen evidence digest covers all of it.

# type: Literal["wandb"] (required)
# base_url: str = "https://api.wandb.ai"
# Explicit W&B API endpoint. Trailing slashes are removed. The normalized endpoint is fingerprinted and passed directly to the public API; WANDB_BASE_URL is not used to choose the evidence source.
# entity: str (required)
# project: str (required)
# Both must be nonempty and slash-free; they address the W&B API path directly.
# metric_key: str (required)
# Key in wandb.run.summary; the value must be a finite number, not a string or boolean.
# poll_seconds: float = 2.0 (> 0 and finite)
# timeout_seconds: float = 120.0 (>= 1 and finite)
# Requires the optional W&B dependency. Polling queries the immutable WANDB_RUN_ID assigned to this attempt and accepts only `finished`; `failed`, `crashed`, or `killed` fails immediately, and absence through timeout fails the trial. W&B request deadlines use whole seconds, so an active request may finish less than one second after this polling budget expires.

# GATE OBJECTS
# A gate must use exactly one discriminator shape. All `path` and JSON `key` fields obey the Extractor path/key invariants above.

# type: Literal["required_file"] (required)
# path: str (required)
# Passes only when the path exists and is a file.

# type: Literal["json_equals"] (required)
# path: str (required)
# key: str (required)
# value: bool | int | float | str | null (required)
# A strict JSON scalar. Equality is type-strict and nothing is coerced, so boolean, integer, float, and string encodings are distinct. Mappings, sequences, non-finite floats (.nan, .inf), and unquoted YAML dates (2024-01-01 parses as a date, not a string) are rejected at load: parsed JSON cannot hold them, so such a gate could never pass, yet the phase fingerprint would render it identically to a value that can. Quote a date ('2024-01-01') to compare it against a JSON string, and use json_scalar_bound for numeric comparisons across integer/float JSON values.

# type: Literal["json_scalar_bound"] (required)
# path: str (required)
# key: str (required)
# min: float | None = null
# max: float | None = null
# At least one finite inclusive bound is required and min must be <= max; the JSON value must be numeric and finite.

# type: Literal["artifact_size"] (required)
# source: Literal["file", "directory", "json"] (required)
# path: str (required)
# key: str | None = null
# `json` requires key and a non-negative integer byte value; `file` and `directory` forbid key. Directory size recursively sums regular files.
# min_bytes: int | None = null (>= 0)
# max_bytes: int | None = null (>= 0)
# At least one inclusive bound is required and min_bytes must be <= max_bytes.

# type: Literal["sha256"] (required)
# path: str (required)
# sha256: str (required)
# Exactly 64 hexadecimal characters; normalized to lowercase. The path must exist and be a file.

# type: Literal["wandb_summary_required"] (required)
# base_url: str = "https://api.wandb.ai"
# Explicit W&B API endpoint, with the same normalization and identity contract as the W&B extractor.
# entity: str (required)
# project: str (required)
# Both must be nonempty and slash-free; they address the W&B API path directly.
# keys: list[str] (required; min length 1)
# poll_seconds: float = 2.0 (> 0 and finite)
# timeout_seconds: float = 120.0 (>= 1 and finite)
# Requires the optional W&B dependency. Lookup and terminal-state rules are the same as the W&B extractor. Once the attempt's run is finished, missing keys fail the gate immediately rather than polling for later summary updates.

# PROMOTION OBJECT

# min_delta_vs: str (required)
# In a phase, names a prior phase. In a suite study, names a prior study or `study.phase`; a bare study selects its final exposed phase.
# Suite comparisons require the candidate and baseline studies to resolve to identical Metric contracts (name, goal, and extractor configuration); incompatible comparisons fail config validation before any study runs.

# min_delta: float = 0.0 (finite)
# Required signed improvement: baseline - candidate for minimize, candidate - baseline for maximize. Promotion occurs when improvement >= min_delta.

# requires_gates: bool = true
# For phase promotion, true makes failed candidate gates fail trials and false makes them advisory. Suite-study promotion runs after its component experiment, so false cannot rescue a trial that a component gate already failed.

# on_fail: Literal["stop", "skip", "continue_baseline"] = "stop"
# For a phase: stop raises, skip ends remaining phases with a partial result, and continue_baseline exposes a clone of the baseline winner.
# For a suite study: stop aborts the suite, skip omits the study (so a later depends_on reference aborts), and continue_baseline substitutes the baseline for the candidate study's final winner.

# SUITE ROOT
# A suite compiles each study into an Experiment named `<suite>__<study>` and runs studies in declaration order. Suite defaults use the Experiment key contracts above.

# suite: str (required)
# Nonempty ASCII `[A-Za-z0-9_-]+` without `__`; used in suite output paths and compiled experiment names. The `__` ban keeps `<suite>__<study>` parseable as exactly one pair.

# defaults: SuiteDefaults = {}
# SuiteDefaults object keys:
#   storage: str | None = null
#   allow_external_rdb_single_host: bool = false
#   workdir: str = "./runs"
#   trial_command: str | None = null
#   trainer_config: dict[str, Any] = {}
#   provenance: dict[str, str] = {}
#   override_format: Literal["yaml_file", "argparse", "json_file", "hydra"] = "yaml_file"
#   metric: Metric | None = null
#   constraints: list[Constraint] = []
#   contracts: dict[str, Contract] = {}
#   env: dict[str, str] = {}
#   timeout_seconds_per_run: float | None = null (>= 0 and finite once compiled)
#   execution: ExecutionContext = {}
# Each resolved value follows the matching Experiment contract. trial_command and metric must be supplied here or by every study; provenance must resolve nonempty for persistent storage; workdir and override_format already have non-null defaults.
# timeout_seconds_per_run resets for each compiled study; it is not a suite-wide deadline.

# studies: list[Study] (required; min length 1)
# Study names must be unique. Each Study object accepts the following keys.

# name: str (required)
# Nonempty ASCII `[A-Za-z0-9_-]+` without `__`; appended to the suite name for paths and Optuna study names.

# depends_on: list[str] = []
# Prior study names that must have exposed results before this study starts. This neither reorders studies nor passes winner overrides into the dependent study.

# storage: str | None = null
# If omitted, inherits defaults.storage; explicit null clears a persistent default and selects in-memory storage.
# auto resolves separately for each compiled <suite>__<study> experiment, using that study's workdir and phases; it is also accepted in defaults.storage.

# allow_external_rdb_single_host: bool | None = null
# If omitted, inherits defaults.allow_external_rdb_single_host; explicit null blocks fallback and fails compilation. Follows the Experiment contract once resolved.

# workdir: str | None = null
# If omitted, inherits defaults.workdir; explicit null blocks fallback and fails compilation because Experiment.workdir is required after resolution.

# trial_command: str | None = null
# If omitted, inherits defaults.trial_command; explicit null blocks fallback and fails compilation. It must resolve non-null.

# trainer_config: dict[str, Any] | None = null
# If omitted, inherits defaults.trainer_config; a non-null mapping replaces the complete default mapping, while explicit null clears it to `{}`. The compiled mapping follows the Experiment trainer_config contract.

# provenance: dict[str, str] | None = null
# If omitted, inherits defaults.provenance; a non-null mapping replaces the default mapping, while explicit null clears it to `{}`. The compiled persistent experiment requires at least one entry.

# override_format: Literal["yaml_file", "argparse", "json_file", "hydra"] | None = null
# If omitted, inherits defaults.override_format; explicit null blocks fallback and fails compilation. The resolved value follows the Experiment contract.

# metric: Metric | None = null
# If omitted, inherits defaults.metric; explicit null blocks fallback and fails compilation. It must resolve non-null.

# constraints: list[Constraint] | None = null
# If omitted, inherits defaults.constraints; explicit null clears the inherited list to `[]`.

# contracts: dict[str, Contract] = {}
# Merges over defaults.contracts; a same-name study contract replaces that default entry. The default mapping cannot be cleared wholesale.

# phases: list[Phase] (required; min length 1)
# Uses the complete Phase contract above; there is no suite-level phase default.

# env: dict[str, str] | None = null
# Omitted or explicit null keeps defaults.env; a non-null mapping merges over it. The default environment cannot be cleared wholesale.

# timeout_seconds_per_run: float | None = null (>= 0 and finite once compiled)
# If omitted, inherits defaults.timeout_seconds_per_run; explicit null clears that default and disables the per-study run deadline.

# execution: ExecutionContext | None = null
# If omitted, inherits defaults.execution; a non-null value replaces the default wholesale (no per-key merge), while explicit null resets to the built-in contract ({cwd: null, inherit_env: "all", passthrough_env: [], record_env: false}).

# promotion: Promotion | None = null
# Compares this study's final exposed phase winner with the selected prior-study winner. Uses the Promotion contract above.

# PhaseSweep configuration reference
#
# This is a hand-written, fully commented key reference, not a runnable config.
# A configuration is one UTF-8 YAML mapping for one Experiment. Duplicate mapping
# keys are rejected. A top-level suite mapping is unsupported.

# EXPERIMENT ROOT

# experiment: str (required)
# Safe `[A-Za-z0-9_-]+` identity used in paths, study names, and locks.

# storage: str | null = null
# null (or omitted) is in-memory and disposable. Allowed durable local forms are
# sqlite:///absolute-or-relative/path.db and journal:///.../path.journal. `auto`
# selects <workdir>/<experiment>/study.db when every phase has n_jobs: 1 and
# study.journal otherwise. Persistent storage requires nonempty provenance.
# External database URLs are rejected before connection or artifact creation.

# workdir: str = "./runs"
# Root containing this experiment's generations, phase directories, trial logs,
# and winners. A current-format root is bound to its supported local ledger.

# trial_command: str (required)
# Shell template for one trial. Supported placeholders are {config_path},
# {overrides}, {trial_dir}, {trial_id}, {phase}, and {run_name}. yaml_file
# requires {config_path}; argparse requires {overrides}.

# trainer_config: dict[str, JSON/YAML-compatible value] = {}
# Complete base configuration for override_format: yaml_file. Dotted inherited,
# fixed, and sampled values are applied to a copied mapping per trial. A nonempty
# mapping is invalid with argparse because argparse does not consume it.

# provenance: dict[str, str] = {}
# Meaningful external trainer/data/dependency identifiers. Required for durable
# local storage and part of the experiment identity.

# override_format: Literal["yaml_file", "argparse"] = "yaml_file"
# yaml_file writes a complete trainer_config.yaml and uses {config_path}.
# argparse emits shell-safe --key=value tokens through {overrides}; it accepts
# null, booleans, integers, finite floats, strings, and nested lists of them.

# metric: Metric (required)
#   name: str = "objective"       # `goal` is reserved and cannot be the name.
#   goal: Literal["minimize", "maximize"] = "minimize"
#   extractor: JsonEnvelopeExtractor | LogRegexExtractor (required)
# Metric extractors are local and must yield a finite value.

# constraints: list[Constraint] = []
# Each constraint has name, a local `json` scalar extractor, and at least one
# finite min/max bound. A failed constraint is COMPLETE but ineligible to win.

# env: dict[str, str] = {}
# Semantic environment values applied over execution inheritance. Generic
# credential/telemetry variables, including WANDB_* values, can be passed to a
# trainer but do not configure a PhaseSweep remote evidence source.

# execution: ExecutionContext = {}
#   cwd: str | null = null
#   inherit_env: "all" | "none" | list[str] = "all"
#   passthrough_env: list[str] = []
#   record_env: bool = false
# cwd and the environment-selection contract join durable experiment identity.
# Pass-through values may rotate, but their names/classification remain semantic.

# timeout_seconds_per_run: float | null = null
# Finite whole-invocation wallclock budget. It is a run control, not a new
# result-selection policy.

# PHASE OBJECTS

# phases: list[Phase] (required; at least one)
# Each phase executes in declaration order. Its name is a safe, case-insensitively
# unique identifier and `inherits` can name prior phases only.

#   name: str (required)
#   comment: str | null = null       # display-only design note
#   inherits: list[str] = []
#   fixed_overrides: dict[str, value] = {}
#   search_space: dict[str, SearchParam] = {}
#   n_trials: int (required; >= 1)
# Dotted override keys use [A-Za-z0-9_-]+ segments. A key and its prefix cannot
# coexist. A local key cannot be both fixed and sampled.
#
# Inherited keys remain fixed. A same-origin diamond is valid. Conflicting keys
# from independent origins require this phase to fix that key explicitly; the
# fixed child value becomes the new origin. An inherited key cannot be sampled.

#   n_jobs: int = 1 (>= 1)
#   gpu_policy: "single_per_trial" | "whole_node" | "none" = "single_per_trial"
#   gpu_ids: list[int] | null = null
#   gpu_devices: list[str] | null = null
#   allow_no_gpu_isolation: bool = false
# GPU policy controls CUDA visibility and same-host leases. whole_node requires
# n_jobs: 1 plus one explicit, unique device list. none forbids explicit device
# lists and needs allow_no_gpu_isolation for parallel work.

#   max_consecutive_failures: int = 5 (>= 1)
#   timeout_seconds_per_trial: float | null = 86400.0
#   allow_unbounded_trials: bool = false
#   timeout_seconds_per_phase: float | null = null
#   allow_incomplete_on_timeout: bool = false
#   allow_partial_grid: bool = false
#   allow_seed_search: bool = false
# n_trials counts terminal Optuna attempts. Null per-trial timeout requires the
# explicit allow_unbounded_trials opt-in. A partial timeout winner is allowed
# only when allow_incomplete_on_timeout is true and a feasible result exists.

#   sampler: Sampler = {}
#     type: "tpe" | "random" | "grid" | "cmaes" = "tpe"
#     seed: int | null = null       # 0 <= seed <= 2**32 - 1
#     n_startup_trials: int = 10    # TPE only
#     acknowledge_nonresumable: bool = false
# A grid may have at most 4,096 combinations, counted before materialization;
# n_trials must equal the cardinality unless allow_partial_grid is true. CMA-ES
# accepts numeric parameters only. Durable random/TPE/CMA-ES phases require a
# seed. Durable TPE/CMA-ES phases require acknowledge_nonresumable: true and
# cannot resume a partially completed target across processes.

#   gates: list[Gate] = []
# Every gate is a local post-trial hard check. Gate failure fails the trial.

# SEARCH PARAMETER OBJECTS

# type: "float"
# low: finite float (required)
# high: finite float (required; >= low)
# log: bool = false                 # requires low > 0 and forbids step
# step: finite float | null = null  # positive; exactly divides high - low

# type: "int"
# low: int (required; >= -2**53)
# high: int (required; <= 2**53 and >= low)
# log: bool = false                 # requires low > 0 and step: 1
# step: int = 1                     # positive; exactly divides high - low

# type: "categorical"
# choices: list[null | bool | int | finite float | str] (required; nonempty)
# Choices must remain distinct under Python equality. Grid rejects logarithmic
# parameters and requires a concrete stepped or categorical domain.

# EVIDENCE EXTRACTORS

# type: "json"
# path: str (trial-relative file; required)
# key: str (nonempty dotted JSON path; required)
# Constraint-only scalar extractor. The selected value must be a finite number.

# type: "json_envelope"
# path: str = "result.json"         # trial-relative file
# objective_name: str (required)
# split: str (required)
# policy: str (required)
# checkpoint: str | null = null
# expected_step: int | null = null  # >= 0
# Requires an attempt-bound complete result envelope. Python trainers can call
# phasesweep.report_objective(), which writes the managed objective path.

# type: "log_regex"
# file: str = "stdout.log"          # trial-relative file
# pattern: str (required; named (?P<value>...) capture)
# select: "last" | "first" | "min" | "max" = "last"

# GATE OBJECTS

# type: "required_file"
# path: str (trial-relative file; required)

# type: "json_equals"
# path: str (trial-relative file; required)
# key: str (nonempty dotted JSON path; required)
# value: bool | int | finite float | str | null (required; type-strict equality)

# type: "json_scalar_bound"
# path: str (trial-relative file; required)
# key: str (nonempty dotted JSON path; required)
# min: finite float | null = null
# max: finite float | null = null
# At least one bound is required and min must not exceed max.

# type: "artifact_size"
# source: "file" | "directory" | "json" (required)
# path: str (trial-relative; `.` is allowed only for source: directory)
# key: str | null = null             # required only for source: json
# min_bytes: int | null = null
# max_bytes: int | null = null

# type: "sha256"
# path: str (trial-relative file; required)
# sha256: str (required; 64 hexadecimal characters)

# FORMAT CUTOVER
# This breaking release accepts only fresh current-format artifact roots, local
# ledgers, and MCP state directories. Do not attempt to migrate, adopt, move,
# rebind, or repair an older namespace. Operate it with the preserved 0.3.1
# release instead.

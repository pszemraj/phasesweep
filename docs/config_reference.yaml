# PhaseSweep config_reference.yaml: exhaustive primary Experiment YAML, signature form.
# Values are signatures (key: type = default), not runnable YAML; start from examples/example.yaml.
# CLI: phasesweep validate CONFIG and phasesweep run CONFIG require an explicit path; no default file or environment-to-config overlay.
# Read once per invocation; detached MCP launch freezes the submitted config. Editing the original does not reload active work.
# Unknown model fields and duplicate YAML keys are rejected. Arbitrary map keys in trainer_config/fixed_overrides/provenance/env are intentional.
# One UTF-8 mapping describes one Experiment; suite documents are unsupported. Built-in defaults are overlaid by YAML values.
# Run flags (--from-phase, --dry-run, --verbose) control execution/display; they do not override YAML keys.
# Relative workdir, journal and execution.cwd paths resolve against invocation cwd; local evidence is trial-relative.
# There is no general ${VAR} interpolation. Shell expansion in trial_command follows the subprocess environment.
# Trainer pass-through values and categorical choices keep YAML scalar types: 1e-3 is a string; 1.0e-3 or 0.001 is numeric. Schema numeric fields can coerce numeric strings but reject booleans.
# Each list/object variant below is an alternative, selected by its type; repeated type entries are documentation, not one combined object.
# <key> in prose means any valid dotted override name, illustrated by optimizer.lr under search_space.
# Operational environment outside YAML: XDG_CACHE_HOME places worker/cache files; PHASESWEEP_HOME selects an existing private absolute 0700 root.
# PHASESWEEP_LOCK_DIR selects an existing safe absolute host-lock directory; by default locks use the OS account home, independent of HOME/XDG.
# Trainer cache paths, model/data downloads, training cadence and hardware usage remain the external trainer's responsibility.
# MCP catalog fields: docs/mcp.md; starting catalog: examples/catalog.yaml.
# Publication and cleanup/recovery are engine behavior, not extra YAML blocks. Current-format state is required; no migration or legacy aliases are accepted.

# ---------- Required experiment fields ----------

# Safe experiment identity used in paths, study names and locks: nonempty [A-Za-z0-9_-]+, e.g. bart_search.
experiment: string (required)

# Shell command for one trainer invocation, e.g. python train.py --config {config_path}.
# Requires: override_format determines the input placeholder: yaml_file always needs {config_path}; argparse/hydra need {overrides}, json_file needs {overrides_path}, unless composed overrides are empty in those three formats; incompatible placeholders fail config load.
# Supported placeholders: {config_path}, {overrides}, {overrides_path}, {trial_dir}, {trial_id}, {phase}, {run_name}; unknown fields and malformed braces fail config load; {{ and }} escape literal braces.
# Paths are shell-quoted by PhaseSweep; do not surround path placeholders with your own quotes. Trial ID is the phase-local Optuna number; run_name includes experiment, phase, trial ID and immutable attempt ID.
# Recommended: use an absolute interpreter/script path and execution.cwd for a real trainer so the controller shell does not choose the wrong executable.
trial_command: string (required)

# Primary finite scalar objective; its extractor selects one observation and its goal ranks trials. No pruning, evaluation scheduling or checkpoint selection is performed by PhaseSweep.
# Requires: metric.name and constraints[].name must all be distinct; duplicate names fail config load.
# Built-in confound verdicts are advisory and cannot be disabled or tuned here. evaluation_point flags positions more than 1% short of the furthest; survivorship flags when failed + pruned >= max(1, ranked), excluding infeasible trials from that threshold; tie flags exact ties between different sampled configurations.
# Verdicts never block selection/publication. n/a means not checked: e.g. JSON/log objectives report no position, a W&B history position is unavailable, or fewer than two trials were ranked for evaluation_point/tie.
metric: object (required)
  # Name published for the objective, e.g. validation_loss; goal is reserved and rejected.
  # Requires: constraints[].name values must all be distinct from metric.name.
  name: string = "objective"

  # Rank the scalar chosen per trial: minimize selects the smallest, maximize the largest.
  # metric.extractor.select for log_regex/mlflow only selects within a run; it does not inherit this ranking direction.
  # Exact ties select the lower Optuna trial number among feasible candidates.
  goal: "minimize" | "maximize" = "minimize"

  # Scalar source, selected by type. Each variant below replaces this one object; do not combine their keys. All accepted objectives are finite scalars.
  # Requires: the mlflow variant needs the top-level mlflow block; W&B variants cannot coexist with that block.
  extractor: json | json_envelope | log_regex | mlflow | wandb (required)
    # Variant json; selected by type: json.
    # Read a finite JSON number; bool/string/container/nonfinite or unrepresentable integer evidence fails extraction.
    type: "json" (required)

    # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
    path: string (required)

    # Nonempty dotted JSON object-key path, e.g. eval.loss; empty segments are rejected. No list-index or literal-dot escaping syntax is provided.
    key: string (required)

    # Variant json_envelope; selected by type: json_envelope.
    # Read an attempt-bound result envelope; the trainer can write it with phasesweep.report_objective(). Attempt identity and content fingerprint must match.
    type: "json_envelope" (required)

    # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory. The default managed objective path is result.json.
    path: string = "result.json"

    # Required nonempty exact objective.name in the envelope, e.g. eval_loss; mismatch fails extraction.
    objective_name: string (required)

    # Required nonempty exact objective.split, e.g. validation; mismatch fails extraction.
    split: string (required)

    # Required nonempty exact evaluation.policy, e.g. final or best; mismatch fails extraction. This validates reported metadata and does not select a checkpoint.
    policy: string (required)

    # Optional exact nonempty checkpoint identity to validate; null accepts any structurally valid checkpoint reported by the trainer. It never loads weights.
    checkpoint: string | null = null

    # Optional exact evaluation step, integer >= 0; null accepts any structurally valid nonnegative reported step. It does not schedule evaluation.
    expected_step: int | null = null

    # Nonempty progress key for objective comparability: step reads the envelope evaluation step; another name, e.g. tokens, reads evaluation.progress and must be reported through report_objective(progress={...}).
    # Requires: the reported position is finite and nonnegative; a missing/invalid custom position fails extraction rather than merely making the confound check unavailable.
    # Only used when: this is metric.extractor; constraints[].extractor must leave the default step or config load fails.
    # Recommended: use tokens for a fixed-token comparison or trained_steps for best-checkpoint reporting, and log the full training budget on that axis.
    evaluation_axis: string = "step"

    # Variant log_regex; selected by type: log_regex.
    # Extract numeric matches from an attempt log; missing evidence or a nonfinite selected value fails the trial.
    type: "log_regex" (required)

    # Trial-relative descendant log path, e.g. stdout.log: nonempty, no absolute paths, NUL or .. segments, and not the trial root. stdout.log and stderr.log are written automatically.
    file: string = "stdout.log"

    # Compilable Python regex with named (?P<value>...) capture, e.g. eval_loss=(?P<value>[0-9.eE+-]+); invalid regex or missing group fails config load.
    # Matching is line by line with Python's default regex flags; inline flags such as (?i) are supported, but a match cannot span lines. Captures that float() cannot parse are skipped; no numeric matches fails extraction.
    pattern: string (required)

    # Select an observation within this trial: last/first use numeric-match order, min/max use numeric values and keep the first equal extreme. first still reads the remaining file for its evidence digest.
    # metric.goal independently ranks the selected per-trial scalars; maximize does not change this selector.
    select: "last" | "first" | "min" | "max" = "last"

    # Variant mlflow; selected by type: mlflow.
    # Read native unscoped metric history from the verified finished run; no local objective mirror is required.
    # Requires: top-level mlflow and an MLflow primary objective; model/dataset-scoped metric observations are unsupported.
    type: "mlflow" (required)

    # Exact nonempty native metric name, e.g. eval_loss or eval/loss; use what the trainer actually logs, including its slashes/underscores. Aliases, summary fallbacks and fuzzy discovery are not provided.
    # Warning: a trainer logging eval_loss cannot satisfy eval/loss; verify the real metric key before launching a sweep.
    metric_key: string (required)

    # Required explicit within-run selection: last chooses greatest step then latest timestamp; min/max choose the extreme value with earliest step then timestamp on ties; step chooses latest timestamp at the exact step.
    # Requires: metric.extractor.step is nonnull exactly for select step; any other pairing fails config load. The same rule applies under constraints[].extractor.
    # metric.goal only ranks trial scalars; it never supplies this selector.
    # The objective's selected native step supplies its advisory evaluation-point position; MLflow has no evaluation_axis override.
    # Warning: min/max reject any nonfinite history point; last/step require the selected point finite. Conflicting values at one step/timestamp fail, and shared capture freezes the native position.
    select: "last" | "min" | "max" | "step" (required)

    # Exact native history step, integer >= 0; null means no exact-step request. Units follow the trainer's logged step counter.
    # Requires: metric.extractor.select step needs this value; setting it for last/min/max fails config load. The same rule applies under constraints[].extractor.
    step: int | null = null

    # Variant wandb; selected by type: wandb.
    # Read the managed attempt's finished scalar summary, never another run; requires the installed W&B extra. Failed/crashed/killed/preempted runs cannot win.
    type: "wandb" (required)

    # Normalized HTTP(S) API endpoint; no embedded credentials, query or fragment. Scheme/host are lowercased and trailing path slashes stripped.
    # Requires: within each phase, its W&B gates and the experiment-level W&B metric/constraints agree on base_url, entity, project, poll_seconds and timeout_seconds; disagreement fails config load. Cannot coexist with mlflow.
    base_url: string = "https://api.wandb.ai"

    # Nonempty account/team name without slash or whitespace, e.g. research-team.
    # Requires: all W&B consumers agree on target and polling fields; credentials in the composed environment must authorize this target.
    entity: string (required)

    # Nonempty project name without slash or whitespace, e.g. bart-search.
    # Requires: all W&B consumers agree on target and polling fields; the trainer must honor managed WANDB_ENTITY/PROJECT/BASE_URL/RUN_ID and WANDB_RESUME=never and finish its run.
    project: string (required)

    # Finite positive polling interval in seconds.
    # Requires: every W&B consumer reached within one phase uses the same interval; disagreement fails config load.
    poll_seconds: float = 2.0

    # Finite operation timeout in seconds, >= 1, capped by remaining phase/run budget; includes remote startup, SDK calls and visibility polling.
    # Requires: every W&B consumer reached within one phase uses the same timeout; disagreement fails config load.
    # The objective's advisory history-position lookup gets a fresh operation timeout after scalar acceptance, still capped by phase/run deadlines.
    timeout_seconds: float = 120.0

    # Exact nonempty finished-summary key, e.g. eval/loss or eval/loss.min for a define_metric summary=min aggregate. A bare key does not substitute for its aggregate suffix.
    # Requires: evaluation_axis must not name this metric or its aggregate's underlying series.
    metric_key: string (required)

    # Nonempty history key marking objective progress, e.g. eval/step or tokens; _step is W&B's history step. Log the axis in the same log() call as the metric. Aggregate-summary keys are positioned at the history series end.
    # Requires: different from metric_key and its aggregate's underlying series; otherwise config load fails.
    # Only used when: this is metric.extractor; constraints[].extractor must retain default _step or config load fails.
    # Warning: position lookup is advisory after objective acceptance; missing/delayed history can leave no position while preserving the scalar.
    evaluation_axis: string = "_step"

# Ordered nonempty list of phase objects; each phase must produce a feasible winner before dependent work can proceed. Values below describe one item.
# Warning: inherits transfers override values, never model weights or checkpoints; the trainer must load a checkpoint explicitly if that is intended.
phases: list[object] (required)
  # Safe nonempty [A-Za-z0-9_-]+ phase identity, e.g. learning_rate. Names must be unique case-insensitively; attempts, generations and tracking are reserved.
  # Requires: phases[].inherits can name this phase only from later declared phases.
  - name: string (required)

    # Target count of terminal Optuna attempts, not successful objectives; integer >= 1. New invocation continuation depends on storage and sampler type.
    # Requires: with phases[].sampler.type grid, the target equals grid cardinality unless phases[].allow_partial_grid is true, and it may never exceed cardinality; config load fails otherwise.
    # Warning: failed/infeasible attempts consume the target; no feasible eligible result fails the phase.
    # Persistent targets cannot decrease. For resumable samplers, raising the accepted target schedules new attempts, including explicit recovery after a durable abort or accepted partial timeout; repeating the same target preserves that decision.
    n_trials: int (required)

    # Free-text design note shown by validate and show-winners; null adds no note. This field is excluded from semantic study identity.
    comment: string | null = null

    # Names of earlier phases whose complete winner overrides become fixed inputs; no automatic previous-phase inheritance. Transitively inherited values keep their original producer.
    # Overrides: trainer_config at inherited dotted paths.
    # Overridden by: phases[].fixed_overrides when the child explicitly fixes an inherited key; the child becomes that key's new origin.
    # Conflicts with: phases[].search_space cannot sample any inherited key; config load fails.
    # Requires: independent parent origins for one key must be resolved explicitly by phases[].fixed_overrides; same-origin diamonds are accepted. Key/prefix namespace collisions fail config load.
    # Warning: weights/checkpoints are never inherited; configure checkpoint input in trainer_config/fixed_overrides explicitly.
    inherits: list[string] = []

    # Fixed trainer-defined values applied to every trial; arbitrary JSON/YAML-compatible values are passed to the command chosen by trial_command. Keys use dotted nonempty [A-Za-z0-9_-]+ segments, e.g. optimizer.lr or training.max_steps.
    # Overrides: trainer_config and phases[].inherits at the same key; independent inherited-origin conflicts must be resolved here or config load fails.
    # Conflicts with: phases[].search_space cannot contain the same local key, and a key and its prefix cannot coexist across inherited/fixed/sampled overrides.
    # Values follow override_format: yaml_file/json_file allow recursive lists and string-keyed mappings; argparse/hydra accept scalar/list values only. All formats reject nonfinite numbers and unsupported YAML objects such as unquoted dates.
    # Recommended: fix batch size, seed, data split and training/evaluation budgets here when comparing hyperparameters; PhaseSweep does not equalize training automatically. Override string values do not expand runtime placeholders.
    fixed_overrides: map[string, any] = {}

    # Trainer-defined dotted override keys mapped to one parameter variant below. optimizer.lr is an example key; replace it with any valid dotted name. Keys and prefixes cannot coexist across composed overrides.
    # Overrides: trainer_config at sampled dotted paths.
    # Conflicts with: phases[].fixed_overrides for the same local key, or phases[].inherits for any inherited key; config load fails.
    # Requires: phases[].allow_seed_search for a key exactly seed or ending .seed; otherwise config load fails.
    # Requires: phases[].sampler.type cmaes permits numeric variants only; grid forbids log parameters and requires a step on floats, with at most 4096 combinations and distinct wire values.
    search_space: map[string, categorical | float | int] = {}
      # Example dotted trainer key; replace optimizer.lr with your parameter name.
      optimizer.lr: categorical | float | int (required)
        # Variant categorical; selected by type: categorical.
        # Select an explicit discrete parameter domain.
        type: "categorical" (required)

        # Nonempty list of null/bool/int/finite-float/string choices; containers are rejected. Values must be distinct under Python equality, so [1, 1.0] and [0, false] fail config load.
        # Requires: phases[].sampler.type cannot be cmaes; grid enumerates these choices.
        # Warning: preserve YAML scalar types: bare 1e-3 is a string in this loader; use 1.0e-3 or 0.001 for a float and quote intended strings.
        choices: list[null | bool | int | float | string] (required)

        # Variant float; selected by type: float.
        # Select a float-valued search parameter.
        type: "float" (required)

        # Inclusive finite lower bound in trainer-defined units.
        # Requires: phases[].search_space.<key>.high >= low; log true needs low > 0.
        low: float (required)

        # Inclusive finite upper bound in trainer-defined units.
        # Requires: high >= phases[].search_space.<key>.low and any step must divide high - low exactly.
        high: float (required)

        # Sample logarithmically instead of linearly.
        # Requires: phases[].search_space.<key>.low > 0; grid rejects logarithmic domains.
        # Conflicts with: phases[].search_space.<key>.step must be null; otherwise config load fails.
        log: bool = false

        # Positive finite increment in trainer-defined units; null is continuous sampling.
        # Requires: the increment divides high - low exactly; grid requires nonnull and rejects points that collapse under its 12-decimal rounding.
        # Conflicts with: phases[].search_space.<key>.log true; config load fails.
        step: float | null = null

        # Variant int; selected by type: int.
        # Select an integer-valued search parameter.
        type: "int" (required)

        # Inclusive integer lower bound in trainer-defined units; >= -9007199254740992.
        # Requires: phases[].search_space.<key>.high >= low; log true needs low > 0.
        low: int (required)

        # Inclusive integer upper bound in trainer-defined units; <= 9007199254740992.
        # Requires: high >= phases[].search_space.<key>.low and step divides high - low exactly.
        high: int (required)

        # Sample logarithmically instead of linearly.
        # Requires: phases[].search_space.<key>.low > 0 and phases[].search_space.<key>.step 1; grid rejects logarithmic domains.
        log: bool = false

        # Positive integer increment in trainer-defined units.
        # Requires: step divides high - low exactly; phases[].search_space.<key>.log true requires step 1, or config load fails.
        step: int = 1

    # Maximum parallel trainer attempts in this phase, integer >= 1; single_per_trial workers wait for exclusive device leases when the pool is smaller than this count.
    # Requires: phases[].gpu_policy whole_node needs 1; none with > 1 needs phases[].allow_no_gpu_isolation true, or config load fails.
    n_jobs: int = 1

    # single_per_trial leases one CUDA-visible token and same-host lock per attempt, even with n_jobs 1; whole_node leases the full explicit configured set; none leaves CUDA isolation and GPU host locks off.
    # Requires: whole_node needs phases[].n_jobs 1 and exactly one of phases[].gpu_ids/phases[].gpu_devices, containing distinct physical devices. Missing/duplicate lists fail config load; aliases and a multi-device world containing MIG tokens fail at runtime.
    # Requires: none forbids explicit device lists and requires phases[].allow_no_gpu_isolation when phases[].n_jobs > 1; config load fails otherwise.
    # Warning: the trainer sees a leased physical GPU as its local cuda:0; use local indexing. Whole-node world size is semantic, while single-device pool size controls throughput.
    # Numeric leased tokens force CUDA_DEVICE_ORDER=PCI_BUS_ID; UUID tokens retain an explicit order or default it to PCI_BUS_ID. gpu_policy none applies no CUDA binding itself.
    gpu_policy: "single_per_trial" | "whole_node" | "none" = "single_per_trial"

    # Explicit nonempty list of nonnegative CUDA indices; each is resolved to physical host-lock identity.
    # Explicit lists take priority over env.CUDA_VISIBLE_DEVICES and inherited visibility for pool discovery; the trainer receives its leased token.
    # Unset: gpu_devices, then env.CUDA_VISIBLE_DEVICES, then the controller's ambient CUDA_VISIBLE_DEVICES, then nvidia-smi inventory determines the pool. Pool discovery reads ambient visibility even when execution.inherit_env excludes it.
    # Conflicts with: phases[].gpu_devices; setting both fails config load.
    # Requires: phases[].gpu_policy must not be none; whole_node requires one explicit unique physical-device list.
    # Recommended: use one explicit index for predictable single-GPU experiments; avoid choosing devices already occupied by another independent workload.
    gpu_ids: list[int] | null = null

    # Explicit nonempty list of CUDA tokens, e.g. ["GPU-..."] or ["MIG-..."]; whitespace is stripped, empty/comma-containing/-1 tokens fail config load.
    # Explicit lists take priority over env.CUDA_VISIBLE_DEVICES and inherited visibility for pool discovery; the trainer receives its leased token.
    # Unset: gpu_ids, then env.CUDA_VISIBLE_DEVICES, then the controller's ambient CUDA_VISIBLE_DEVICES, then nvidia-smi inventory determines the pool. Pool discovery reads ambient visibility even when execution.inherit_env excludes it.
    # Conflicts with: phases[].gpu_ids; setting both fails config load.
    # Requires: phases[].gpu_policy must not be none; whole_node requires unique physical devices and rejects multi-device MIG worlds at runtime.
    gpu_devices: list[string] | null = null

    # Permit intentional parallel CPU/external-isolation work or unavailable host-lock isolation.
    # Requires: phases[].gpu_policy none with phases[].n_jobs > 1 needs true; default false refuses that config. Under single_per_trial, unavailable GPUs with parallel jobs fail unless true.
    # An explicit env.CUDA_VISIBLE_DEVICES value of "" or "-1" disables CUDA and pins that sentinel into each single_per_trial trainer without GPU locks; parallel jobs need no opt-in in this case. gpu_policy none still requires its parallel opt-in.
    # Warning: true can permit unrestricted GPU visibility without host locks; it does not turn a CUDA model into a CPU model. A single-job run on a host with no GPUs can proceed without this flag.
    allow_no_gpu_isolation: bool = false

    # Sampling strategy and its random seed; nested defaults apply when omitted.
    # phases[].search_space, phases[].n_trials and storage; see each child for supported domains and durable continuation.
    sampler: object = {}
      # Optuna strategy: tpe fits a surrogate after startup trials, random samples independently, grid enumerates a concrete matrix, cmaes samples numeric spaces and requires the installed cmaes dependency.
      # Requires: phases[].search_space must be numeric for cmaes; grid needs nonlog domains, a step for floats, at most 4096 distinct combinations and a compatible phases[].n_trials/phases[].allow_partial_grid target.
      # Requires: persistent storage needs phases[].sampler.seed for random/tpe/cmaes and phases[].sampler.acknowledge_nonresumable for tpe/cmaes.
      # Warning: TPE/CMA-ES targets must finish in one invocation; interrupted partial targets cannot resume or be enlarged across processes. Grid and seeded random support ordinary continuation; acknowledge_nonresumable true with random/grid fails config load.
      type: "tpe" | "random" | "grid" | "cmaes" = "tpe"

      # Sampler RNG seed, integer 0 through 4294967295; independent of the trainer seed in trainer_config or fixed_overrides.
      # Unset: stochastic suggestions are not seeded; persistent storage rejects null for random/tpe/cmaes.
      # Requires: storage auto/journal with phases[].sampler.type random/tpe/cmaes needs an explicit seed; grid is exempt.
      seed: int | null = null

      # Number of random TPE startup attempts before fitting, integer >= 0.
      # Only used when: phases[].sampler.type is tpe; every other type must leave the value 10 or config load fails.
      n_startup_trials: int = 10

      # Accept the process-local-state restriction of TPE/CMA-ES.
      # Requires: persistent storage and phases[].sampler.type tpe/cmaes need true.
      # Only used when: phases[].sampler.type is tpe/cmaes; true with random/grid fails config load.
      # Warning: acknowledgement permits the run, not continuation after interruption.
      acknowledge_nonresumable: bool = false

    # Abort after this many consecutive failed/infeasible trials, integer >= 1; a feasible success resets the streak. Failed attempts still count toward phases[].n_trials.
    # The streak and abort decision persist on durable storage in completion order. Raising this limit does not undo a recorded abort; a resumable sampler needs a larger n_trials target or a new experiment identity for recovery.
    # Recommended: lower the threshold for an expensive trainer when configuration failure should stop promptly.
    max_consecutive_failures: int = 5

    # Trainer timeout in seconds, finite and >= 0 when nonnull; default 259200 is 72 hours. Zero expires immediately.
    # Requires: null needs phases[].allow_unbounded_trials true; config load fails otherwise.
    # Combined with phases[].timeout_seconds_per_phase and timeout_seconds_per_run, the earliest active deadline limits work.
    # Starts at supervised launch (including supervisor startup), after GPU lease acquisition; it does not bound the lease wait or post-trainer evidence reads. Phase/run deadlines also cover those stages. This field participates in semantic study identity, so changing it cannot reuse a populated phase.
    timeout_seconds_per_trial: float | null = 259200.0

    # Explicitly permit a trainer invocation with no per-trial deadline.
    # Requires: phases[].timeout_seconds_per_trial null needs true; otherwise config load fails. Other phase/run deadlines still apply.
    allow_unbounded_trials: bool = false

    # Phase wallclock budget in seconds, finite and >= 0 when nonnull; null adds no phase deadline and zero expires immediately.
    # Combined with phases[].timeout_seconds_per_trial and timeout_seconds_per_run, the earliest active deadline limits work.
    # phases[].allow_incomplete_on_timeout controls whether a feasible partial winner may be accepted.
    # Starts immediately before the phase's optimize loop, after resume checks, environment preflight and GPU discovery. It covers queued GPU leases, trainer execution and evidence reads; cleanup can extend beyond the deadline.
    timeout_seconds_per_phase: float | null = null

    # Allow a feasible winner from fewer than phases[].n_trials attempts after a phase/run wallclock timeout and persist that accepted partial decision; default false fails closed. Reusing a partial winner also requires true.
    # Only used when: phases[].timeout_seconds_per_phase or timeout_seconds_per_run leaves an incomplete phase; this does not substitute a baseline or make missing/infeasible evidence win.
    # Repeating the same accepted n_trials replays the partial decision without filling its unused slots. A resumable sampler needs a larger target to launch new work. A per-trial timeout alone does not enable partial acceptance.
    allow_incomplete_on_timeout: bool = false

    # Allow a grid target smaller than its full cardinality; false requires the full matrix.
    # Only used when: phases[].sampler.type is grid; true on other samplers has no effect.
    # phases[].n_trials must still be <= grid cardinality, or config load fails.
    allow_partial_grid: bool = false

    # Permit search-space keys exactly seed or ending .seed for an explicit stochastic-variance audit.
    # Requires: phases[].search_space containing those keys needs true; false rejects them at config load. Fixed seeds remain allowed.
    # Warning: searching seeds selects stochastic variation rather than a model/config improvement.
    allow_seed_search: bool = false

    # Post-trial hard checks selected by type; each variant below describes one list item. Any failed gate fails the attempt. Local paths are inside the fresh attempt directory, and remote gates use its shared verified capture.
    gates: list[artifact_size | json_equals | json_scalar_bound | mlflow_required | required_file | sha256 | wandb_summary_required] = []
      # Variant artifact_size; selected by type: artifact_size.
      # Require an artifact byte count inside inclusive bounds.
      - type: "artifact_size" (required)

        # file uses a file's size; directory recursively counts regular files/file-symlink targets without following directory symlinks; json reads a saved nonnegative integer byte count (booleans, floats and strings fail the gate).
        # Requires: phases[].gates[].key exactly when source is json; invalid pairing fails config load.
        source: "file" | "directory" | "json" (required)

        # Trial-relative path, nonempty with no absolute/NUL/.. paths; . is allowed only with source directory. File/json requires a descendant file.
        path: string (required)

        # Nonempty dotted JSON key, e.g. artifact.bytes, with no empty segments; null when source is not json.
        # Requires: phases[].gates[].source json needs key; a key with file/directory fails config load.
        key: string | null = null

        # Inclusive minimum bytes, integer >= 0; null adds no lower bound.
        # Requires: phases[].gates[].min_bytes or phases[].gates[].max_bytes must be nonnull, and min_bytes <= max_bytes when both are set; otherwise config load fails.
        min_bytes: int | null = null

        # Inclusive maximum bytes, integer >= 0; null adds no upper bound.
        # Requires: phases[].gates[].min_bytes or phases[].gates[].max_bytes must be nonnull, and min_bytes <= max_bytes when both are set; otherwise config load fails.
        max_bytes: int | null = null

      # Variant json_equals; selected by type: json_equals.
      # Require type-strict equality to a JSON scalar: true, 1 and 1.0 are different values.
      - type: "json_equals" (required)

        # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
        path: string (required)

        # Nonempty dotted JSON object-key path, e.g. eval.loss; empty segments are rejected. No list-index or literal-dot escaping syntax is provided.
        key: string (required)

        # Expected null/bool/int/finite-float/string; mappings/lists/YAML dates and nonfinite floats are rejected. Quote a date to compare a JSON string.
        value: bool | int | float | string | null (required)

      # Variant json_scalar_bound; selected by type: json_scalar_bound.
      # Require a finite numeric JSON value inside inclusive configured bounds.
      - type: "json_scalar_bound" (required)

        # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
        path: string (required)

        # Nonempty dotted JSON object-key path, e.g. eval.loss; empty segments are rejected. No list-index or literal-dot escaping syntax is provided.
        key: string (required)

        # Inclusive finite lower bound in the JSON scalar's units; null adds no lower bound.
        # Requires: phases[].gates[].min or phases[].gates[].max is nonnull, and min <= max when both are set; config load fails otherwise.
        min: float | null = null

        # Inclusive finite upper bound in the JSON scalar's units; null adds no upper bound.
        # Requires: phases[].gates[].min or phases[].gates[].max is nonnull, and min <= max when both are set; config load fails otherwise.
        max: float | null = null

      # Variant mlflow_required; selected by type: mlflow_required.
      # Require metric observations and metadata from the same bound MLflow run.
      # Requires: top-level mlflow with an MLflow objective; at least one of metrics/params/tags must be nonempty, or config load fails.
      - type: "mlflow_required" (required)

        # Nonempty exact native metric names when populated, e.g. [eval_loss, train_loss]; each requires a finite last observation.
        # Requires: metrics, params or tags must contain at least one name collectively.
        metrics: list[string] = []

        # Nonempty exact native parameter names when populated, e.g. [learning_rate, model_name]; presence is checked, values are retained as strings.
        # Requires: metrics, params or tags must contain at least one name collectively.
        params: list[string] = []

        # Nonempty exact native tag names when populated, e.g. [trainer, dataset_revision]; presence is checked, values are retained as strings.
        # Requires: metrics, params or tags must contain at least one name collectively.
        tags: list[string] = []

      # Variant required_file; selected by type: required_file.
      # Require a local attempt file to exist.
      - type: "required_file" (required)

        # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
        path: string (required)

      # Variant sha256; selected by type: sha256.
      # Require an exact SHA-256 file digest; hashing occurs after the trainer exits.
      - type: "sha256" (required)

        # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
        path: string (required)

        # Expected 64 hexadecimal characters; uppercase is accepted and normalized to lowercase. A mismatch fails the gate.
        sha256: string (required)

      # Variant wandb_summary_required; selected by type: wandb_summary_required.
      # Require exact summary-key presence in the same accepted finished capture; values need not be numeric.
      # With no W&B scalar consumer, capture accepts the first finished summary and missing keys fail immediately. With scalar consumers it waits for all numeric keys before checking gate presence. Gate-only phases may use different W&B targets from one another.
      - type: "wandb_summary_required" (required)

        # Normalized HTTP(S) API endpoint; no embedded credentials, query or fragment. Scheme/host are lowercased and trailing path slashes stripped.
        # Requires: within each phase, its W&B gates and the experiment-level W&B metric/constraints agree on base_url, entity, project, poll_seconds and timeout_seconds; disagreement fails config load. Cannot coexist with mlflow.
        base_url: string = "https://api.wandb.ai"

        # Nonempty account/team name without slash or whitespace, e.g. research-team.
        # Requires: all W&B consumers agree on target and polling fields; credentials in the composed environment must authorize this target.
        entity: string (required)

        # Nonempty project name without slash or whitespace, e.g. bart-search.
        # Requires: all W&B consumers agree on target and polling fields; the trainer must honor managed WANDB_ENTITY/PROJECT/BASE_URL/RUN_ID and WANDB_RESUME=never and finish its run.
        project: string (required)

        # Finite positive polling interval in seconds.
        # Requires: every W&B consumer reached within one phase uses the same interval; disagreement fails config load.
        poll_seconds: float = 2.0

        # Finite operation timeout in seconds, >= 1, capped by remaining phase/run budget; includes remote startup, SDK calls and visibility polling.
        # Requires: every W&B consumer reached within one phase uses the same timeout; disagreement fails config load.
        timeout_seconds: float = 120.0

        # Nonempty list of nonempty exact summary keys, e.g. [eval/loss, trainer_revision]; missing keys fail the gate.
        keys: list[string] (required)

# ---------- Trainer inputs ----------

# Complete base input for the external trainer, copied for each trial and written to trainer_config.yaml. PhaseSweep forwards its arbitrary keys to the program in trial_command, not to a built-in training API. Common trainer-defined keys are model.name, optimizer.lr and output_dir.
# Only used when: override_format is yaml_file; a nonempty mapping in any other format fails config load.
# Overridden by: phases[].inherits, phases[].fixed_overrides and phases[].search_space at their exact dotted paths; descending through an existing scalar fails config load.
# String values recursively expand {trial_dir}, {trial_id}, {phase}, {run_name} once before applying overrides; keys and override values are not expanded. Use output_dir: "{trial_dir}/checkpoints" for separate trial outputs.
# Values must be null, bool, int, finite float, string, lists or string-keyed mappings; quote YAML dates. No model download, optimizer setting, batch size or step budget is supplied automatically.
trainer_config: map[string, any] = {}

# Trainer input boundary. yaml_file emits the complete base plus composed overrides; json_file emits nested overrides-only JSON; argparse emits shell-safe --key=value; hydra emits native key=value without importing Hydra.
# Requires: trial_command must consume the matching placeholder and trainer_config must be empty outside yaml_file; violations fail config load.
# Argparse/hydra accept null, bool, int, finite float, string and recursive lists; argparse renders null as None, hydra as null. Hydra rejects control characters and ${...} strings. JSON requires strict JSON-compatible values.
# The flat overrides_resolved.json is always the audit copy; it is not the complete YAML trainer input.
override_format: "yaml_file" | "argparse" | "hydra" | "json_file" = "yaml_file"

# ---------- Storage and provenance ----------

# Local study persistence: null is disposable in-memory storage, auto resolves to <workdir>/<experiment>/study.journal, and an explicit journal:///path/to/study.journal selects a local journal. journal:///./runs/study.journal is relative to the invocation directory; journal:////tmp/study.journal is absolute.
# Requires: provenance must be nonempty for auto or journal storage; stochastic phases also need phases[].sampler.seed, and durable TPE/CMA-ES need phases[].sampler.acknowledge_nonresumable. Config load fails otherwise.
# Requires: workdir must stay bound to the same supported local ledger for reuse.
# Reuse also requires current-format artifacts, matching trainer/evidence/provenance semantics and the existing semantic environment cohort. Changing semantic inputs needs a fresh experiment identity; run-control changes do not waive stored abort/partial decisions.
# Warning: null cannot resume or top up a later invocation; SQLite, :memory:, external database URLs and all other storage forms are rejected. Journals support parallel trials on one host, not distributed-host execution.
storage: string | null = null

# Root for per-experiment generations, phase/trial artifacts, logs and winner files; relative paths resolve against invocation cwd, not the YAML file or execution.cwd. A leading ~ is expanded.
# Requires: storage identity must agree with an existing artifact-root binding; mismatch refuses reuse.
# Warning: changing execution.cwd does not relocate this root. Trainer outputs need a trial-specific path supplied through trainer_config or trial_command.
workdir: string = "./runs"

# Operator-defined nonblank string keys/values identifying external trainer, data and dependency inputs, e.g. trainer_revision, dataset_revision, tokenizer_revision. These participate in persistent-study identity.
# Requires: storage auto or journal requires at least one entry; blank keys/values fail config load.
# Recommended: change these identifiers whenever an input outside this YAML changes; PhaseSweep does not infer downloaded model/data revisions.
provenance: map[string, string] = {}

# ---------- Constraints ----------

# Optional feasibility bounds, separate from metric ranking. A measured violation is COMPLETE but cannot win; missing or invalid evidence fails the trial. Values below describe one item.
# Requires: constraints[].name must differ from metric.name and every other constraint name.
constraints: list[object] = []
  # Published constraint name; any string accepted by the schema.
  # Requires: distinct from metric.name and all constraints[].name; duplicates fail config load.
  - name: string (required)

    # Finite scalar reader; same variants and keys as metric.extractor above.
    # Only used when: evaluation_axis remains its default for JSON-envelope/W&B constraint extractors; nondefault values fail config load because only the objective axis is read.
    extractor: json | json_envelope | log_regex | mlflow | wandb (required)
      # Variant json; selected by type: json.
      # Read a finite JSON number; bool/string/container/nonfinite or unrepresentable integer evidence fails extraction.
      type: "json" (required)

      # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory.
      path: string (required)

      # Nonempty dotted JSON object-key path, e.g. eval.loss; empty segments are rejected. No list-index or literal-dot escaping syntax is provided.
      key: string (required)

      # Variant json_envelope; selected by type: json_envelope.
      # Read an attempt-bound result envelope; the trainer can write it with phasesweep.report_objective(). Attempt identity and content fingerprint must match.
      type: "json_envelope" (required)

      # Trial-relative descendant file path, e.g. result.json; nonempty, no absolute paths, NUL or .. segments, and not the trial root. The trainer must write it in this attempt directory. The default managed objective path is result.json.
      path: string = "result.json"

      # Required nonempty exact objective.name in the envelope, e.g. eval_loss; mismatch fails extraction.
      objective_name: string (required)

      # Required nonempty exact objective.split, e.g. validation; mismatch fails extraction.
      split: string (required)

      # Required nonempty exact evaluation.policy, e.g. final or best; mismatch fails extraction. This validates reported metadata and does not select a checkpoint.
      policy: string (required)

      # Optional exact nonempty checkpoint identity to validate; null accepts any structurally valid checkpoint reported by the trainer. It never loads weights.
      checkpoint: string | null = null

      # Optional exact evaluation step, integer >= 0; null accepts any structurally valid nonnegative reported step. It does not schedule evaluation.
      expected_step: int | null = null

      # Nonempty progress key for objective comparability: step reads the envelope evaluation step; another name, e.g. tokens, reads evaluation.progress and must be reported through report_objective(progress={...}).
      # Requires: the reported position is finite and nonnegative; a missing/invalid custom position fails extraction rather than merely making the confound check unavailable.
      # Only used when: this is metric.extractor; constraints[].extractor must leave the default step or config load fails.
      # Recommended: use tokens for a fixed-token comparison or trained_steps for best-checkpoint reporting, and log the full training budget on that axis.
      evaluation_axis: string = "step"

      # Variant log_regex; selected by type: log_regex.
      # Extract numeric matches from an attempt log; missing evidence or a nonfinite selected value fails the trial.
      type: "log_regex" (required)

      # Trial-relative descendant log path, e.g. stdout.log: nonempty, no absolute paths, NUL or .. segments, and not the trial root. stdout.log and stderr.log are written automatically.
      file: string = "stdout.log"

      # Compilable Python regex with named (?P<value>...) capture, e.g. eval_loss=(?P<value>[0-9.eE+-]+); invalid regex or missing group fails config load.
      # Matching is line by line with Python's default regex flags; inline flags such as (?i) are supported, but a match cannot span lines. Captures that float() cannot parse are skipped; no numeric matches fails extraction.
      pattern: string (required)

      # Select an observation within this trial: last/first use numeric-match order, min/max use numeric values and keep the first equal extreme. first still reads the remaining file for its evidence digest.
      # metric.goal independently ranks the selected per-trial scalars; maximize does not change this selector.
      select: "last" | "first" | "min" | "max" = "last"

      # Variant mlflow; selected by type: mlflow.
      # Read native unscoped metric history from the verified finished run; no local objective mirror is required.
      # Requires: top-level mlflow and an MLflow primary objective; model/dataset-scoped metric observations are unsupported.
      type: "mlflow" (required)

      # Exact nonempty native metric name, e.g. eval_loss or eval/loss; use what the trainer actually logs, including its slashes/underscores. Aliases, summary fallbacks and fuzzy discovery are not provided.
      # Warning: a trainer logging eval_loss cannot satisfy eval/loss; verify the real metric key before launching a sweep.
      metric_key: string (required)

      # Required explicit within-run selection: last chooses greatest step then latest timestamp; min/max choose the extreme value with earliest step then timestamp on ties; step chooses latest timestamp at the exact step.
      # Requires: metric.extractor.step is nonnull exactly for select step; any other pairing fails config load. The same rule applies under constraints[].extractor.
      # metric.goal only ranks trial scalars; it never supplies this selector.
      # Warning: min/max reject any nonfinite history point; last/step require the selected point finite. Conflicting values at one step/timestamp fail, and shared capture freezes the native position.
      select: "last" | "min" | "max" | "step" (required)

      # Exact native history step, integer >= 0; null means no exact-step request. Units follow the trainer's logged step counter.
      # Requires: metric.extractor.select step needs this value; setting it for last/min/max fails config load. The same rule applies under constraints[].extractor.
      step: int | null = null

      # Variant wandb; selected by type: wandb.
      # Read the managed attempt's finished scalar summary, never another run; requires the installed W&B extra. Failed/crashed/killed/preempted runs cannot win.
      type: "wandb" (required)

      # Normalized HTTP(S) API endpoint; no embedded credentials, query or fragment. Scheme/host are lowercased and trailing path slashes stripped.
      # Requires: within each phase, its W&B gates and the experiment-level W&B metric/constraints agree on base_url, entity, project, poll_seconds and timeout_seconds; disagreement fails config load. Cannot coexist with mlflow.
      base_url: string = "https://api.wandb.ai"

      # Nonempty account/team name without slash or whitespace, e.g. research-team.
      # Requires: all W&B consumers agree on target and polling fields; credentials in the composed environment must authorize this target.
      entity: string (required)

      # Nonempty project name without slash or whitespace, e.g. bart-search.
      # Requires: all W&B consumers agree on target and polling fields; the trainer must honor managed WANDB_ENTITY/PROJECT/BASE_URL/RUN_ID and WANDB_RESUME=never and finish its run.
      project: string (required)

      # Finite positive polling interval in seconds.
      # Requires: every W&B consumer reached within one phase uses the same interval; disagreement fails config load.
      poll_seconds: float = 2.0

      # Finite operation timeout in seconds, >= 1, capped by remaining phase/run budget; includes remote startup, SDK calls and visibility polling.
      # Requires: every W&B consumer reached within one phase uses the same timeout; disagreement fails config load.
      timeout_seconds: float = 120.0

      # Exact nonempty finished-summary key, e.g. eval/loss or eval/loss.min for a define_metric summary=min aggregate. A bare key does not substitute for its aggregate suffix.
      # Requires: evaluation_axis must not name this metric or its aggregate's underlying series.
      metric_key: string (required)

      # Nonempty history key marking objective progress, e.g. eval/step or tokens; _step is W&B's history step. Log the axis in the same log() call as the metric. Aggregate-summary keys are positioned at the history series end.
      # Requires: different from metric_key and its aggregate's underlying series; otherwise config load fails.
      # Only used when: this is metric.extractor; constraints[].extractor must retain default _step or config load fails.
      # Warning: position lookup is advisory after objective acceptance; missing/delayed history can leave no position while preserving the scalar.
      evaluation_axis: string = "_step"

    # Inclusive finite maximum in the measured scalar's units; null adds no upper bound.
    # Requires: constraints[].min or constraints[].max must be nonnull, and min <= max when both are set; otherwise config load fails.
    max: float | null = null

    # Inclusive finite minimum in the measured scalar's units; null adds no lower bound.
    # Requires: constraints[].min or constraints[].max must be nonnull, and min <= max when both are set; otherwise config load fails.
    min: float | null = null

# ---------- MLflow target and ownership ----------

# Optional native MLflow source and result destination; no standalone or cross-backend publishing.
# Unset: MLflow integration is off; MLflow extractors/gates without this block fail config load.
# Requires: metric.extractor.type must be mlflow and W&B extractors/gates cannot be mixed anywhere; violations fail config load. Local JSON/log constraints and local gates remain allowed.
# Requires: the controller must have the MLflow extra installed, the target experiment must already exist and credentials must reach both controller and trainer; validate/dry-run do not verify authentication or experiment existence; each phase checks both before allocating any trial.
# Result projections are queued automatically for accepted trials and generation summaries. A failed upload leaves pending delivery without invalidating accepted scientific results; phasesweep sync-tracking CONFIG retries every generation's saved projections (--generation ID limits it to one) without training or rereading metrics. No YAML publishing/retry switch is provided.
mlflow: object | null = null
  # Existing tracking server target: HTTP(S) URL, databricks or databricks://profile. HTTP scheme/host are lowercased and trailing path slashes stripped; embedded credentials, query, fragment and profile names containing spaces are rejected. Local file/sqlite tracking URIs are unsupported.
  # Requires: experiment_id or experiment_name selects exactly one existing active experiment at this target; the controller verifies it before trial launch.
  # env.MLFLOW_TRACKING_URI must match this value if explicitly configured; use credential environment variables instead of URL credentials.
  tracking_uri: string (required)

  # Nonempty native MLflow experiment ID, e.g. "123"; quote numeric IDs so YAML keeps a string. PhaseSweep looks it up and never creates an experiment.
  # Unset: experiment_name is required instead.
  # Conflicts with: mlflow.experiment_name; both set or both null fails config load.
  # mlflow.tracking_uri selects the server on which this ID must already exist; an absent/deleted target fails before training.
  experiment_id: string | null = null

  # Nonempty exact existing MLflow experiment name, e.g. bart-search; lookup must resolve an active experiment. No implicit experiment creation occurs.
  # Unset: experiment_id is required instead.
  # Conflicts with: mlflow.experiment_id; both set or both null fails config load.
  # mlflow.tracking_uri selects the server on which this name must already exist.
  experiment_name: string | null = null

  # Ownership of each attempt run. managed creates the real run before trainer launch and supplies MLFLOW_RUN_ID; the trainer must attach/log to that ID, and PhaseSweep can finish a still-RUNNING run after successful trainer exit. trainer requires the trainer to create and finish its actual run and call phasesweep.tracking.bind_mlflow_run(actual_run_id) inside the active run.
  # Requires: trainer mode must bind exactly the actual run in the configured experiment; missing, foreign or conflicting binding fails the trial. The exact bound trainer run may retain an existing parent; substituting another parent/subrun for evidence or using model/dataset-scoped metrics is unsupported.
  # Warning: a trainer that creates another run instead of attaching to the managed ID logs invisible evidence; a successful process exit alone cannot make that attempt eligible.
  # Recommended: managed for a trainer that can honor MLFLOW_RUN_ID; trainer for code that must own start_run(). Disable conflicting autolog/nested-run behavior in the trainer itself.
  run_mode: "managed" | "trainer" = "managed"

  # Seconds between remote run/evidence visibility polls; must be > 0.
  # Recommended: use a finite interval; current validation also accepts positive infinity, which is not a practical polling interval.
  poll_seconds: float = 2.0

  # Per controller tracking-operation budget in seconds; must be >= 1. Remaining phase/run deadlines also cap experiment resolution, run creation and evidence capture; result uploads are publication and are bounded only by this value. This does not limit training time.
  # Recommended: use a finite value long enough for server/SDK startup; current validation also accepts positive infinity.
  # Warning: positive infinity removes this bound; a result upload to an unresponsive server then blocks the sweep until the server responds.
  timeout_seconds: float = 120.0

# ---------- Execution environment ----------

# Explicit string environment values layered over execution.inherit_env and execution.passthrough_env. Arbitrary names are passed to the trainer; their values are semantic experiment inputs.
# Overrides: execution.inherit_env and execution.passthrough_env values of the same name. PhaseSweep then assigns attempt identity, input/evidence paths and leased CUDA_VISIBLE_DEVICES.
# Requires: with MLflow, MLFLOW_RUN_ID is forbidden here and explicit MLFLOW_TRACKING_URI/MLFLOW_EXPERIMENT_ID/MLFLOW_EXPERIMENT_NAME must match the configured target, or config load fails. Managed values replace ambient defaults.
# Requires: with W&B evidence, explicit WANDB_BASE_URL/ENTITY/PROJECT/RESUME must match the evidence target, WANDB_RUN_ID is forbidden, and offline/disabled settings fail before training; PhaseSweep binds one fresh attempt ID.
# Without W&B evidence consumers, an explicitly configured env.WANDB_RUN_ID remains trainer-owned; an ambient/inherited WANDB_RUN_ID is removed. Other trainer-owned WANDB_* settings are preserved.
# Recommended: put rotating credentials/proxies in execution.passthrough_env and make them available to the controller too. Generic trainer telemetry settings are preserved when their backend is not an evidence consumer.
# Recommended: under gpu_policy none, set CUDA_VISIBLE_DEVICES here or include it in execution.inherit_env when narrowing inheritance; otherwise an ambient GPU restriction can be dropped. single_per_trial pool discovery separately reads ambient visibility and rebinds its leased tokens or disable sentinel. Set trainer cache variables such as HF_HOME, HF_DATASETS_CACHE, TORCH_HOME and TMPDIR to writable locations when needed; PhaseSweep does not provision or warm trainer caches.
# Explicit phases[].gpu_ids/phases[].gpu_devices take priority over this CUDA visibility for pool discovery; the trainer receives its leased device token.
env: map[string, string] = {}

# Trainer subprocess working-directory and environment-selection contract. Nested defaults apply when the block is omitted. Effective cwd, inheritance modes/names and pass-through classification participate in study identity.
execution: object = {}
  # Working directory for every trainer subprocess; null uses invocation cwd. Relative paths and ~ resolve at launch against invocation cwd, not the config file. The effective absolute cwd participates in study identity.
  # Requires: a configured directory must exist at launch; otherwise the trainer is not started.
  # Recommended: use an absolute path for script/data resolution; workdir and local evidence retain their separate path rules.
  cwd: string | null = null

  # Ambient trainer environment: all copies every variable; none retains only PATH, HOME, LANG, LC_ALL, TMPDIR, USER, LOGNAME, TZ when present; a list adds exactly those named variables to that base.
  # Overridden by: env for matching names.
  # Conflicts with: execution.passthrough_env must not overlap an explicit name list; duplicate, empty or padded names fail config load.
  # Warning: inherited values outside execution.passthrough_env must match the durable study cohort before new trial allocation. all can make unrelated shell changes prevent reuse.
  # Recommended: list required model/cache/GPU variables explicitly for controlled training; narrowed inheritance does not acquire excluded authentication or cache variables later.
  inherit_env: "all" | "none" | list[string] = "all"

  # Additional ambient variable names for rotating credentials or transport, e.g. MLFLOW_TRACKING_TOKEN, HTTPS_PROXY. Names/classification are semantic, values are excluded from the persistent environment cohort digest. Missing ambient variables are not invented.
  # Conflicts with: execution.inherit_env explicit lists must not overlap; duplicate, empty or padded names fail config load.
  # Overridden by: env for matching names, whose configured values remain semantic.
  # Warning: this selects credentials for the trainer and for PhaseSweep's own evidence and tracking workers, which run with the same composed environment, so listed values must exist in the controller's ambient environment, including for sync-tracking. Model/data/cache settings that change trial meaning belong in env or execution.inherit_env instead.
  passthrough_env: list[string] = []

  # Write the composed base environment before per-trial PHASESWEEP_* and GPU bindings into trial environment.json, owner-only mode 0600. Names and the semantic digest are recorded regardless of this flag.
  # Warning: true retains ambient and pass-through secrets in the file; use only when retaining the full environment is intentional.
  record_env: bool = false

# Whole run wallclock budget in seconds, finite and nonnegative; null adds no run deadline, zero expires immediately.
# Combined with phases[].timeout_seconds_per_phase and phases[].timeout_seconds_per_trial, the earliest active deadline limits work. W&B evidence reads and MLflow resolution, run creation and evidence capture are also capped by the remaining phase/run budget; MLflow result uploads are publication.
# An incomplete phase fails closed unless phases[].allow_incomplete_on_timeout permits a feasible partial winner.
# Starts after the generation is claimed, before execution preflight and phase work; initial locking/ledger setup is outside this clock. Cleanup/publication may extend beyond the deadline, which never waives process-cleanup requirements.
timeout_seconds_per_run: float | null = null

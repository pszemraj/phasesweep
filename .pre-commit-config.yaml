# Every hook is `repo: local` with `language: system`: it runs the tool already
# installed in the active development environment (`pip install -e ".[dev]"`),
# so pre-commit builds no per-hook environments, needs no network, and uses the
# same tool versions as manual runs. Activate that environment before
# committing or pushing.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pathlint
        name: pathlint
        entry: pathlint
        language: system
        files: ^(src|tests)/.*\.py$
      # doc_check.py is a maintainer script outside the repository; without it
      # the hook reports the skip and passes. Its report prints only on failure.
      - id: doc-check
        name: doc-check (strict)
        entry: >-
          bash -c 'script="$HOME/scripts/py/doc_check.py";
          [ -f "$script" ] || { echo "doc_check.py not found; skipped"; exit 0; };
          out=$(python "$script" --strict --no-check-lazy "$@") || { printf "%s\n" "$out"; exit 1; }' --
        language: system
        files: ^src/.*\.py$
        verbose: true
      - id: module-size
        name: module size
        entry: bash scripts/check_module_size.sh
        language: system
        files: ^(src|tests)/.*\.py$
      # Any, typing.cast and `# type: ignore` on a line the commit adds. The
      # script reads the staged diff itself, so it takes no file arguments.
      - id: typing-escapes
        name: typing escapes
        entry: python scripts/check_typing_escapes.py
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false
      # Review provenance ("review vX / blocker N", "PR #N", "Pre-vX") belongs
      # in git history; a comment states its reason in place.
      - id: no-review-tags
        name: no review provenance tags
        entry: '(?i:review v[0-9]|\bPR #[0-9]+|reviewer [0-9]|\bblocker [0-9]|gap hunt|\bpre-v[0-9])|\bfinding [A-Z][0-9]+\b'
        language: pygrep
        files: ^(src|tests)/.*\.py$
      # Runs on every commit: the contracts span all of src/ and the pytest
      # configuration.
      - id: contract-tests
        name: contract tests
        entry: pytest tests/test_ledger_contract.py tests/test_error_routing.py tests/test_ledger_read_paths.py -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
      # Collect every test module without executing tests.
      - id: pytest-collection
        name: whole-suite collection
        entry: pytest --collect-only -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        pass_filenames: false
        stages: [pre-push]

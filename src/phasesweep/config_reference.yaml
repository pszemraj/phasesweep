# config_reference.yaml: every key of a PhaseSweep experiment, in signature form (key: type = default), so it does not load. Start from examples/example.yaml.

# Config file: the CONFIG argument of phasesweep run, validate, status, show-winners and sync-tracking, read once per invocation. No default file is searched.
# The MCP server rereads an edited config before its next tool call, and a failed reread refuses launches until fixed: docs/mcp.md#the-catalog.
# Precedence, lowest to highest: built-in defaults, the YAML, then run --set KEY=VALUE (docs/config.md#run-time-overrides). No environment variable sets a key.
# The file is one UTF-8 YAML mapping. An unknown or duplicate key, or a value that breaks a constraint stated here, fails config load with an error naming it.
# Paths: a relative workdir, journal path or execution.cwd resolves against the config file's directory, after symlinks. A leading ~ expands from HOME.
# Trial paths (extractor path and file, gate path) are relative to the attempt directory, nonempty, without NUL or .. segments, and name a file below it.
# JSON evidence is parsed strictly: duplicate names or NaN and Infinity tokens invalidate the file. A JSON key is a dotted path of nonempty object keys.
# YAML scalars follow PyYAML (YAML 1.1) typing: 1e-3 and 1.0e3 load as strings, 1.0e-3, 0.001 and 1.0e+3 as floats.
# Numeric keys accept numeric strings, reject booleans and must be finite. Bounds are inclusive, and a lower bound may not exceed its upper bound.
# Values passed to the trainer unchanged (trainer_config, fixed_overrides, choices, repeats.values) keep their YAML type, so quote what must stay a string.
# Every key is in the study fingerprint, which a study with trials refuses to change, except storage, workdir, observe and timeout_seconds_per_run.
# Also outside it: execution.record_env, mlflow.poll_seconds, mlflow.timeout_seconds and the run-control keys listed under Phases.
# Notation: a `| null = null` key may be omitted, which turns its feature off unless an Unset: line says otherwise. TitleCase types are shared blocks.
# Environment variables PhaseSweep reads: docs/runtime.md#environment-variables. The MCP catalog is a separate file: docs/mcp.md#the-catalog.

# ---------- Experiment ----------

# Name of the experiment, for example bart_search: nonempty, with only the characters A-Z a-z 0-9 _ and -.
# It names the artifact directory under workdir and every study, <experiment>::<phase>, and it keys the experiment lock.
# Warning: renaming starts new studies and a new artifact directory, and results recorded under the old name are not reused.
experiment: string (required)

# Shell command template that runs one trainer attempt under /bin/sh -c in execution.cwd, with the trainer environment rather than the shell's. It must exit 0.
# {trial_dir} is the absolute attempt directory, {trial_id} the phase's trial number, {phase} its name, {run_name} <experiment>-<phase>-<trial_id>-<attempt ID>.
# {config_path}, {overrides} or {overrides_path} carries the trainer input, as override_format says, for example python train.py --config {config_path}.
# PhaseSweep shell-quotes every placeholder but {trial_id}. Write {{ and }} for literal braces and $VAR or ${{VAR}} for a shell variable.
# Unknown placeholders, attribute or index access, format specs such as {trial_id:05d}, conversions such as {phase!r}, or unbalanced braces fail config load.
trial_command: string (required)

# ---------- Objective ----------
# A read by metric.extractor that fails, or that yields a value that is not a finite number, fails the trial.
# Warning: under Transformers load_best_model_at_end=True, a wandb or mlflow position cannot show which checkpoint was scored. Use json_envelope then.
# validate and run --dry-run warn when trainer_config, fixed_overrides or trial_command enables it under a wandb or mlflow metric.extractor.

# Primary objective: the scalar each trial reports and how trials rank. PhaseSweep does no pruning, evaluation scheduling or checkpoint selection.
# Selection records advisory confound verdicts on the winner, which never block selection or publication.
# See: docs/runtime.md#confound-verdicts
metric: object (required)
  # Nonempty name the objective is published under, for example validation_loss. The name goal is reserved.
  # Requires: distinct from every constraints[].name and observe[].name, which are distinct from each other too.
  name: string = "objective"

  # Direction in which trials rank and the sampler optimizes: minimize prefers the smallest value. A persistent study stored with the other direction is refused.
  # It never changes select on a log_regex or mlflow extractor, which chooses within one trial.
  goal: "minimize" | "maximize" = "minimize"

  # Where the objective value is read from, selected by type.
  extractor: JsonExtractor | JsonEnvelopeExtractor | LogRegexExtractor | MlflowExtractor | WandbExtractor (required)

  # Viability ceiling in the metric's units: a larger value makes the attempt infeasible. It keeps its real value for the sampler but cannot win.
  # Use a bound to refuse a degenerate score, such as a loss of exactly 0 from a leaked evaluation set. It never ranks or steers the search.
  # Warning: an infeasible attempt counts toward phases[].max_consecutive_failures, so a bound inside the ordinary spread can abort the phase.
  max: float | null = null

  # Viability floor in the metric's units: a smaller value makes the attempt infeasible, with the same consequences as metric.max.
  min: float | null = null

# ---------- Phases ----------
# Phases run in declared order, and a failed phase ends the run before later phases start.
# Which value a trainer key gets, lowest to highest: trainer_config, an inherited value, then the phase's own fixed_overrides, search_space or repeats.key.
# A key may appear in one of fixed_overrides, search_space and repeats.key only, and no key across them and inherited keys may be a dotted prefix of another.
# A key parents export with different origins must be fixed in fixed_overrides or be repeats.key. A key an inherited phase sampled cannot be searched again.
# With sampler.type grid, n_trials is at least the grid size, the search_space combinations times the repeat values, unless allow_partial_grid is true.
# On storage null a grid's n_trials is at most the grid size, and a fixed configuration (empty search_space, no repeats) needs n_trials 1.
# With repeats under seeded random, n_trials is a multiple of the number of repeat values, and exactly that number when search_space is empty.
# On persistent storage, launch and dry run refuse an n_trials above the grid size plus the study's failed attempts. A fixed configuration is a one-cell grid.
# Run-control keys, outside the fingerprint: n_trials, comment, n_jobs, gpu_ids, gpu_devices, max_consecutive_failures, timeout_seconds_per_phase, allow_*.
# See: docs/config.md#phase-composition

# Ordered list of phase objects, at least one.
phases: list[object] (required)
  # Phase name, for example learning_rate: nonempty, with only A-Z a-z 0-9 _ and -, unique ignoring case, and not attempts, generations or tracking in any case.
  # Warning: renaming a phase starts a new study, <experiment>::<phase>.
  - name: string (required)

    # Target number of finished attempts, an integer >= 1. COMPLETE, INFEASIBLE and FAIL attempts count, and interrupted ones do not.
    # When the target is reached with no eligible feasible attempt, the phase fails.
    # On persistent storage a raised target runs the remaining attempts in the same study, and a lowered one is refused.
    # While a phase that inherits from this one, even indirectly, has trials, a run that would add trials here is refused. Use a new experiment name then.
    # See: docs/runtime.md#timeouts-cleanup-and-continuation for retries, aborts and partial results.
    n_trials: int (required)

    # Free-text note on the phase. validate prints the current note, and show-winners the one stored with the published generation.
    comment: string | null = null

    # Earlier phases whose winners' effective overrides, their inherited, fixed and sampled keys, become fixed inputs here. Nothing is inherited unless listed.
    # Only phases declared before this one can be listed. trainer_config is not inherited, and an inherited value keeps the phase that produced it as its origin.
    # Warning: only override values are inherited, never weights or checkpoints. Load a checkpoint explicitly through trainer_config or fixed_overrides.
    # Warning: the parents' winners are part of this phase's study fingerprint, so a changed parent winner stops a populated study of this phase from being reused.
    inherits: list[string] = []

    # Fixed trainer-defined values for every trial of the phase, keyed by dotted paths of nonempty A-Z a-z 0-9 _ - segments, for example optimizer.lr.
    # Under argparse and hydra a value is null, a boolean, an integer, a finite float, a string, or a list of those nested to any depth.
    # yaml_file and json_file also take string-keyed mappings. No format takes a non-finite number or an unquoted YAML date, and strings expand no placeholders.
    # Recommended: when comparing hyperparameters, fix batch size, seed, data split and the training budget here, because PhaseSweep does not equalize training.
    fixed_overrides: map[string, any] = {}

    # Map from a dotted trainer key, under the fixed_overrides key rules, to the parameter sampled for it. The sampled value reaches the trainer like a fixed one.
    # Empty without repeats: a fixed configuration, which draws nothing and runs fixed_overrides as they are. n_trials above 1 then only retries failed attempts.
    # validate and run --dry-run warn about such an n_trials above 1, because only a launch can count the failed attempts it would retry.
    # Empty with repeats: a seed audit, one configuration run once per repeat value.
    # A key whose last component is seed, data_seed or random_state, matched case-sensitively, fails config load, because a searched seed lets noise win.
    search_space: map[string, categorical | float | int] = {}
      # Example dotted trainer key; replace optimizer.lr with your parameter name.
      optimizer.lr: categorical | float | int (required)
        # Variant categorical: pick one of an explicit list of values. grid enumerates every choice, and cmaes rejects this variant.
        type: "categorical" (required)

        # Nonempty list of null, boolean, integer, finite float or string values, distinct under Python equality, so [1, 1.0] and [0, false] fail.
        # Under override_format argparse and hydra the choices must also be distinct as command-line values, so [1, "1"] fails under argparse.
        # Warning: YAML types are kept, so a bare 1e-3 is the string "1e-3". validate and run --dry-run warn about a string choice that Python reads as a finite float.
        choices: list[null | bool | int | float | string] (required)

        # Variant float: sample a float between low and high. The trainer receives a Python float, unrounded by samplers other than grid even with a step.
        type: "float" (required)

        # Inclusive lower bound, in trainer-defined units.
        low: float (required)

        # Inclusive upper bound, in trainer-defined units.
        high: float (required)

        # Sample on a logarithmic scale. It needs low above 0 and no step, and grid rejects it.
        log: bool = false

        # Spacing between allowed values, greater than 0. high - low must be a whole number of steps, compared on Python's shortest decimal spelling.
        # So 0.0 to 1.0 by 0.1 is valid. grid requires a step and rounds each point to 12 decimals.
        # Under that rounding, points that collapse, leave low to high, or drift off low + i * step fail config load.
        # Unset: continuous sampling.
        step: float | null = null

        # Variant int: sample an integer between low and high. The trainer receives a Python int.
        type: "int" (required)

        # Inclusive lower bound, an integer of at least -9007199254740992 (-2^53).
        low: int (required)

        # Inclusive upper bound, an integer of at most 9007199254740992 (2^53).
        high: int (required)

        # As in the float variant, except that a logarithmic scale needs step 1.
        log: bool = false

        # Spacing between allowed values, an integer greater than 0 that divides high - low.
        step: int = 1

    # Run every configuration once per repeat value, typically seeds, and rank configurations by a reducer over their members instead of by single trials.
    # Warning: R repeat values multiply the phase's cost by R. For a continuous hyperparameter, more distinct values with one trial each cover the same ground.
    # Recommended: keep repeats for a few discrete finalists whose gap is near the noise, a one-off seed audit, or a final configuration's spread.
    # Requires: sampler.type grid, or random with sampler.seed on any storage, and allow_partial_grid false.
    # See: docs/config.md#repeats and docs/runtime.md#repeat-groups
    repeats: object | null = null
      # Dotted override key, under the fixed_overrides key rules, that receives the repeat value on every trial and is recorded as a param, for example seed.
      # The winner exports neither this key nor an inherited value it replaced, so a phase that inherits this one runs its own value or none.
      key: string (required)

      # Repeat values, at least two: null, booleans, integers, finite floats or strings, distinct as categorical choices must be.
      values: list[bool | int | float | string | null] (required)

      # How a group's member metrics combine into the value it ranks by: mean or median.
      reduce: "mean" | "median" = "mean"

    # Sampling strategy and its parameters. Omit the block for the defaults.
    sampler: object = {}
      # Optuna strategy. tpe fits a surrogate model after its random startup trials, random samples independently, grid enumerates a matrix, and cmaes runs CMA-ES.
      # Requires: cmaes only with float and int parameters, and the cmaes package, which the config load error names when it is missing.
      # Requires: grid only with no log parameter, a step on every float, and at most 4096 combinations, repeat values included, even with allow_partial_grid.
      # Warning: random draws are independent and with replacement, seeded or not, so a value can repeat or never be drawn. Use grid to cover every value.
      # See: docs/runtime.md#interrupted-trials-rerun for draw positions and reproducibility.
      type: "tpe" | "random" | "grid" | "cmaes" = "tpe"

      # Sampler seed, an integer from 0 to 4294967295, independent of any trainer seed.
      # Requires: set when the phase draws with random, tpe or cmaes on persistent storage.
      # Seeded random, tpe and cmaes draws also use the study name <experiment>::<phase>, so renaming either changes them.
      # For grid the seed alone fixes the matrix order, which also decides which points a partial grid runs. An unset grid seed orders it as seed 0 does.
      # Unset: random, tpe and cmaes draw unseeded.
      seed: int | null = null

      # Random startup trials before the tpe model is fitted, an integer >= 0. Only COMPLETE and INFEASIBLE trials count toward it.
      # validate and run --dry-run warn when a tpe phase that draws has n_trials at or below it, because the model is then never fitted.
      # Only used when: sampler.type is tpe. Any other type must leave it at 10, or config load fails.
      n_startup_trials: int = 10

    # Allow n_trials below the grid size. The sampler seed then decides which points run.
    # Only used when: sampler.type is grid. true with any other type fails config load.
    allow_partial_grid: bool = false

    # ---------- Phase GPU placement ----------
    # whole_node needs n_jobs 1; Linux requires exactly one explicit device list, while macOS discovers its pool.
    # none forbids gpu_ids and gpu_devices, and with n_jobs above 1 it needs allow_no_gpu_isolation true.
    # On Apple silicon macOS the discovered pool is one MPS device; Intel Macs discover no GPU. macOS refuses gpu_ids and gpu_devices.
    # On Linux, without gpu_ids or gpu_devices the pool is discovered from env.CUDA_VISIBLE_DEVICES, else the controller's ambient CUDA_VISIBLE_DEVICES, else nvidia-smi.
    # On Linux, validate, the dry run and the launch check listed devices and env.CUDA_VISIBLE_DEVICES tokens against nvidia-smi, so an unknown one fails there.
    # See: docs/runtime.md#gpu-isolation

    # Number of trials run at the same time, an integer >= 1. Under single_per_trial each takes its own device lease, so extra trials queue for a smaller pool.
    # validate, the dry run and the launch warn when it exceeds the device pool. With tpe, more than 1 turns on Optuna's constant_liar.
    # Warning: with tpe or cmaes in a phase that draws, more than 1 makes seeded draws depend on completion order. validate and run --dry-run warn.
    n_jobs: int = 1

    # Device lease policy. single_per_trial leases one device per attempt, with a same-host lock held until the trainer's process group exits.
    # MPS leases use gpu_mps.lock without assigning CUDA_VISIBLE_DEVICES; the trainer selects its device.
    # whole_node gives the one running attempt every listed CUDA device, comma-joined, or the discovered MPS device; its device count is fingerprinted.
    # none binds no device and takes no lock. Set CUDA_VISIBLE_DEVICES in env, or name it in execution.inherit_env, when the trainer needs a restriction.
    # Warning: the trainer sees a leased GPU as its local cuda:0, so index devices locally.
    gpu_policy: "single_per_trial" | "whole_node" | "none" = "single_per_trial"

    # Explicit CUDA device indices, each an integer >= 0, used instead of discovery. An empty list is rejected.
    # Duplicates collapse under single_per_trial and fail config load under whole_node.
    # Conflicts with: phases[].gpu_devices (config load fails if both are set).
    # Unset: the pool is discovered.
    # Recommended: list one index for a predictable single-GPU experiment, because leases rotate across a larger pool. Avoid devices another workload uses.
    gpu_ids: list[int] | null = null

    # Explicit CUDA device tokens: numeric strings such as "0", or GPU- and MIG- prefixes, each matching exactly one nvidia-smi device and rewritten to its full ID.
    # An empty list, an empty token, a token with a comma, or -1 fails config load. Whitespace around a token is stripped, and MIG tokens need nvidia-smi -L.
    # Duplicates collapse under single_per_trial, and aliases of one card, such as an index and its UUID, collapse with a warning.
    # Under whole_node a repeated token fails config load, and an alias or a multi-device list with a MIG token fails when the inventory is checked.
    # Unset: the pool is discovered.
    gpu_devices: list[string] | null = null

    # Let a phase run without GPU host locks or CUDA isolation where PhaseSweep would refuse.
    # It does nothing when GPUs are detected, when a device list is set, or under whole_node. With no GPU found, n_jobs above 1 needs it.
    # Any n_jobs needs it when the driver lists hardware but nvidia-smi cannot enumerate it or resolve the ambient CUDA_VISIBLE_DEVICES tokens.
    # A CUDA_VISIBLE_DEVICES of "" or -1, from env or the ambient environment, disables CUDA for single_per_trial trainers and needs no opt-in.
    # Warning: true can let trainers see every GPU without host locks. It does not turn a CUDA model into a CPU model.
    allow_no_gpu_isolation: bool = false

    # ---------- Phase limits ----------
    # The earliest of the per-trial, phase and run deadlines ends the work it covers. Cleanup and publication can run past a deadline.
    # A failure a deadline causes, such as an evidence read cut short, records the attempt as interrupted, which counts toward neither n_trials nor the streak.
    # When a deadline and a failure-streak abort stop the same phase short of n_trials, the deadline decides the outcome and the abort is retired.
    # See: docs/runtime.md#timeouts-cleanup-and-continuation

    # Stop the phase after this many consecutive failed or infeasible attempts, an integer >= 1.
    # A feasible success resets the count, and an interrupted attempt leaves it unchanged.
    # A recorded abort refuses later runs until a raised n_trials retires it, or, for a streak abort with trials left to run, a limit above the count it recorded.
    # Recommended: lower it for an expensive trainer, so a broken configuration stops the phase quickly.
    # Recommended: with repeats, keep it above the repeat count, or one configuration failing every value aborts the phase. validate and run --dry-run warn.
    max_consecutive_failures: int = 5

    # Wallclock limit for one trainer process, in seconds, >= 0. null means no limit, and 0 expires at once, so every attempt fails.
    # Its clock starts at the supervised launch, after the GPU lease is held, so it excludes the lease wait and the evidence reads.
    # A trainer it kills fails the attempt. A trainer that a phase or run deadline stops first is interrupted instead, and it reruns.
    # Requires: phases[].allow_unbounded_trials true for null.
    timeout_seconds_per_trial: float | null = 259200.0

    # Permit timeout_seconds_per_trial null. true alone changes nothing, because the 72-hour default applies until that key is null.
    allow_unbounded_trials: bool = false

    # Wallclock budget for the phase, in seconds, >= 0. Its clock starts after the resume checks and GPU discovery, before the first trial.
    # A phase with no work left never starts the clock. 0 makes a phase with work fail before any trial starts, which allow_incomplete_on_timeout cannot rescue.
    timeout_seconds_per_phase: float | null = null

    # Accept a feasible winner from fewer than n_trials attempts when a phase or run deadline leaves the phase incomplete, and persist that decision.
    # false fails the run as a timeout. A per-trial timeout alone never enables it, and it never lets missing or infeasible evidence win.
    # Reusing a stored partial result, on a replay or through --from-phase, needs it true as well.
    allow_incomplete_on_timeout: bool = false

    # ---------- Phase gates ----------
    # Gates run after the trainer exits 0 and the objective and every constraint were read, in that order. Local gates read the attempt directory.
    # Every gate runs and failures are joined into one message. A failed gate fails the attempt, even one a violated constraint already made infeasible.

    # Hard checks on the attempt's evidence, selected by type. Each item is one gate.
    gates: list[artifact_size | json_equals | json_scalar_bound | mlflow_required | required_file | sha256 | wandb_summary_required] = []
      # Variant artifact_size: require an artifact's size in bytes within min_bytes and max_bytes, at least one of which is set.
      - type: "artifact_size" (required)

        # Where the size comes from: file is one file, directory the total of regular files below a directory, json a nonnegative integer byte count in a JSON file.
        # directory counts the targets of file symlinks, never follows a directory symlink, and skips broken symlinks and special files.
        # directory fails on a path that is itself a symlink, an entry it cannot stat, or a subdirectory it cannot list.
        # Requires: key exactly when source is json.
        source: "file" | "directory" | "json" (required)

        # Trial path, which names a directory when source is directory. There . names the attempt directory itself.
        # Warning: . counts the files PhaseSweep writes there, such as stdout.log, stderr.log, command.txt and the trainer input.
        path: string (required)

        # JSON key of the byte count, for example artifact.bytes.
        key: string | null = null

        # Minimum size in bytes, an integer >= 0.
        min_bytes: int | null = null

        # Maximum size in bytes, an integer >= 0.
        max_bytes: int | null = null

      # Variant json_equals: require a JSON value to equal a scalar of the same JSON type, so true, 1 and 1.0 differ. A missing file or key fails the gate.
      - type: "json_equals" (required)

        # JSON file to read, for example result.json.
        path: string (required)

        # JSON key of the value, for example eval.loss.
        key: string (required)

        # Expected value: null, a boolean, an integer, a finite float or a string. A mapping, a list or a YAML date fails config load, so quote a date to compare text.
        value: bool | int | float | string | null (required)

      # Variant json_scalar_bound: require a finite JSON number within min and max, at least one of which is set. A boolean or a string fails the gate.
      - type: "json_scalar_bound" (required)

        # JSON file holding the number, for example result.json.
        path: string (required)

        # JSON key of the number, for example eval.loss.
        key: string (required)

        # Lower bound, in the units of the JSON number.
        min: float | null = null

        # Upper bound, in the units of the JSON number.
        max: float | null = null

      # Variant mlflow_required: require metrics, params and tags on the attempt's own MLflow run, from the capture the objective reads.
      # A name missing from a finished run fails the trial at once, as an objective read error that names it and lists the run's keys of that kind.
      # Requires: the mlflow block, and at least one name across metrics, params and tags. Every name is nonempty.
      - type: "mlflow_required" (required)

        # Exact native metric names, for example [eval_loss, train_loss]. Each needs a finite last observation.
        metrics: list[string] = []

        # Exact native parameter names, for example [learning_rate]. Only their presence is checked.
        params: list[string] = []

        # Exact native tag names, for example [dataset_revision]. Only their presence is checked.
        tags: list[string] = []

      # Variant required_file: require a regular file. An empty file and a symlink to a file pass, while a directory, a broken symlink or a special file fails.
      - type: "required_file" (required)

        # File to require, for example result.json.
        path: string (required)

      # Variant sha256: require the exact SHA-256 digest of a file, hashed after the trainer exits. A directory or a missing file fails the gate.
      - type: "sha256" (required)

        # File to hash, for example model.safetensors.
        path: string (required)

        # Expected digest: 64 hexadecimal characters. Uppercase is accepted and lowercased. A mismatch fails the gate.
        sha256: string (required)

      # Variant wandb_summary_required: require summary keys, of any value type, in the finished W&B capture the phase's other W&B readers share.
      # Without a W&B objective or constraint, the capture takes the first finished summary, so a missing key fails the gate at once.
      # Such gate-only phases may use different W&B targets from one another.
      - type: "wandb_summary_required" (required)
        <<: WandbTarget
        # Exact summary keys that must be present, for example [eval/loss, trainer_revision]: a nonempty list of nonempty keys.
        keys: list[string] (required)

# ---------- Trainer inputs ----------
# override_format decides how trainer_config, with the phase's overrides applied, reaches the trainer, and which trial_command placeholder carries it:
#   yaml_file  {config_path}     trainer_config.yaml, complete, with keys sorted at every level.
#   json_file  {overrides_path}  overrides.json, with dotted keys expanded into nested objects. Values must be strict JSON.
#   argparse   {overrides}       flattened leaves as shell-quoted --key=value tokens: null as None, a boolean as true or false, a string as written.
#   hydra      {overrides}       flattened leaves as shell-quoted key=value tokens, strings double-quoted. A string with ${ or a control character fails.
# Under argparse and hydra a float renders with Python's str() and a list as [a,b], recursively.
# trial_command may not carry another format's placeholder, and yaml_file always needs its own.
# The other formats need theirs once a phase has an inherited, fixed, sampled or repeat key, or trainer_config is nonempty.
# Under argparse and hydra every flattened leaf must render: no mapping inside a list, no empty mapping, no dotted literal key colliding with a nested mapping.

# Base trainer input under every override_format, with the phase's overrides applied at their dotted paths. PhaseSweep defines none of its keys.
# Values are null, booleans, integers, finite floats, strings, lists or string-keyed mappings. Quote YAML dates.
# String values expand {trial_dir}, {trial_id}, {phase} and {run_name} once, before overrides apply, as raw text without shell quoting.
# So output_dir: "{trial_dir}/ckpt" gives each trial its own directory. Other braces stay as written, but a doubled {{trial_dir}} still expands inside them.
# An override whose dotted path would descend through a scalar, null or list here fails config load.
trainer_config: map[string, any] = {}

# How the trainer receives its inputs, as the section rules above describe.
# Warning: argparse passes a boolean as --key=true or --key=false, which a plain store_true flag rejects. validate and run --dry-run name every boolean value.
override_format: "yaml_file" | "argparse" | "hydra" | "json_file" = "yaml_file"

# ---------- Storage and provenance ----------
# <workdir>/<experiment> records its first storage: a switch between null and a journal or between journals is refused, as is a journal naming another workdir.

# Where the study ledger lives: null in memory, auto at <workdir>/<experiment>/study.journal, or a journal:///PATH file. Other URLs, such as SQLite, fail.
# Three slashes start a relative path and four an absolute one, as in journal:///./runs/s.journal and journal:////tmp/s.journal. ~ expands after three slashes.
# The scheme is lowercase journal and the URL names a file. A ? or # in the URL, or in a relative path's config directory, fails config load, so use auto then.
# Requires: a nonempty provenance for auto or a journal.
# Warning: null cannot resume or top up a later invocation, and nothing it interrupts reruns. Every invocation runs the whole n_trials again.
storage: string | null = null

# Directory for per-experiment generations, attempt directories, logs and winner files. Write . for the config file's directory; "" fails config load.
# Warning: changing execution.cwd does not move it. Give trainer outputs a trial-specific path through trainer_config or trial_command.
workdir: string = "./runs"

# Operator-defined identifiers of inputs outside this YAML that git does not capture, such as dataset_revision and dependency versions.
# Keys and values are nonblank strings. Each generation records the trainer's git revision apart and never compares it, so trainer code needs no entry.
# Warning: values are copied into each generation's shareable reproducibility.json, so they must not hold secrets.
# Recommended: change a value whenever its input changes. A study with trials then refuses the changed fingerprint, so run under a new experiment name.
provenance: map[string, string] = {}

# ---------- Constraints ----------
# A measured value outside a constraint's bounds makes the attempt infeasible: it keeps its real objective value for the sampler but cannot win.
# An infeasible attempt counts toward phases[].max_consecutive_failures. Every constraint is read even after one is violated.
# A read that fails, or a value that is not a finite number, fails the attempt at once, before later constraints and gates are read.

# Feasibility bounds on additional scalars, separate from metric ranking. Each item is one constraint.
constraints: list[object] = []
  # Nonempty constraint name, distinct from the other names metric.name lists, which labels the measured value in published results.
  - name: string (required)

    # Scalar reader, selected by type. A json_envelope or wandb reader here must leave evaluation_axis at its default.
    extractor: JsonExtractor | JsonEnvelopeExtractor | LogRegexExtractor | MlflowExtractor | WandbExtractor (required)

    # Upper bound on the measured value, in its units. At least one of max and min is set.
    max: float | null = null

    # Lower bound on the measured value, in its units.
    min: float | null = null

# ---------- Observations ----------
# An observation is read after the trial is accepted and its objective located, so it never spends the budget acceptance needed.
# A read that fails, or a value that is not a finite number, logs a warning and records nothing for that name, never failing the trial or changing selection.
# See: docs/config.md#report-only-observations for where recorded values appear.

# Report-only scalars recorded from each accepted trial. Each item is one observation.
observe: list[object] = []
  # Nonempty observation name, distinct from the other names metric.name lists, which labels the value in trials.csv, winner.yaml, MLflow and MCP.
  - name: string (required)

    # Local scalar reader, selected by type. wandb and mlflow readers fail config load, because a key the trainer never wrote would fail every trial.
    # Recommended: when metric.extractor is json_envelope, write the value with report_objective(..., extra=...) and read it with a json reader.
    extractor: JsonExtractor | JsonEnvelopeExtractor | LogRegexExtractor (required)

# ---------- MLflow target and ownership ----------
# env may set MLFLOW_TRACKING_URI, MLFLOW_EXPERIMENT_ID or MLFLOW_EXPERIMENT_NAME only to the mlflow block's own normalized value, and never MLFLOW_RUN_ID.
# Requires: constraint and observation names and override keys make valid MLflow keys after their phasesweep.* prefix, so acc@1 fails config load.

# Native MLflow integration on one existing experiment: the source of the objective's metrics and the destination of PhaseSweep's result projections.
# Requires: metric.extractor of type mlflow, and no W&B reader or gate anywhere. Local constraints and gates stay allowed.
# Requires: the phasesweep[mlflow] extra, and credentials with write access in both the controller and the trainer environment.
# Warning: validate and run --dry-run check neither the credentials nor the experiment. Each phase with trials left checks both before its first trial.
# See: docs/mlflow.md for run ownership, result delivery and sync-tracking.
mlflow: object | null = null
  # MLflow tracking server: an http or https URL, databricks, or databricks://profile. Local file and sqlite URIs are rejected.
  # An http URL is checked and normalized as WandbTarget.base_url is. A databricks profile with whitespace or a path is rejected.
  # The normalized value goes to the MLflow client and to the trainer as MLFLOW_TRACKING_URI. Put credentials in environment variables, not the URI.
  tracking_uri: string (required)

  # Native MLflow experiment ID, for example "123". Quote it so YAML keeps a string.
  # Exactly one of experiment_id and experiment_name is required. PhaseSweep looks the experiment up and never creates it.
  # The trainer receives the resolved ID as MLFLOW_EXPERIMENT_ID under either selector.
  experiment_id: string | null = null

  # Exact nonempty name of an existing active MLflow experiment, for example bart-search.
  experiment_name: string | null = null

  # Who creates and ends each attempt's run. managed: PhaseSweep creates it before the trainer starts and supplies MLFLOW_RUN_ID.
  # trainer: the trainer creates and ends its own run and calls phasesweep.tracking.bind_mlflow_run(run_id) inside it.
  # Warning: a trainer that starts a different run instead of attaching to the managed ID logs evidence PhaseSweep does not read.
  # Recommended: managed when the trainer can honor MLFLOW_RUN_ID, and trainer for code that must own start_run(). Disable autologging and nested runs either way.
  # See: docs/mlflow.md#choose-run-ownership
  run_mode: "managed" | "trainer" = "managed"

  # Seconds between polls while waiting for the attempt's run to finish, or for a run whose creation was not confirmed to appear. Greater than 0.
  poll_seconds: float = 2.0

  # Seconds each controller tracking operation may take, at least 1. It never limits training time.
  # Experiment resolution, run creation, evidence capture and each result upload get a separate budget of this length.
  # A creation whose outcome is unconfirmed is never sent again; a search for its identity tags gets a fresh budget of this length to find the run.
  # Phase and run deadlines also cap resolution, creation and capture, and a capture cut short fails the trial. An upload that runs out waits for sync-tracking.
  # Recommended: leave room for SDK startup and a slow server. The default suits most servers.
  timeout_seconds: float = 120.0

# ---------- Execution environment ----------
# Trainer environment, lowest to highest precedence: what execution.inherit_env selects, execution.passthrough_env, env, then per-attempt variables.
# Before a phase with work left runs, its tracked environment must match the one its study's trials recorded, or the run is refused naming each difference.
# See: docs/config.md#trainer-contract

# Explicit trainer environment values, as YAML strings. A name must be nonempty and free of = and NUL, and a value free of NUL.
# The per-attempt PHASESWEEP_* names, listed in docs/config.md#trainer-contract, fail config load.
# See: the MLflow section rules and WandbTarget for the tracking variables it may set.
# Warning: values are written in plain text to config.snapshot.yaml and with every trial in the study ledger, so rotating secrets belong in passthrough_env.
# Recommended: set cache variables such as HF_HOME and TORCH_HOME here when the trainer needs them. PhaseSweep does not provision trainer caches.
env: map[string, string] = {}

# Trainer working directory and environment-selection contract. Nested defaults apply when the block is omitted.
execution: object = {}
  # Working directory of every trainer process. Write . for the config file's directory; "" fails config load.
  # It is not checked at config load. A missing directory fails each attempt before the trainer starts, and the failures count toward max_consecutive_failures.
  # Unset: the directory phasesweep was started from, or the catalog entry's cwd under MCP. A study with trials then refuses a run from another directory.
  # Recommended: set it, or use absolute interpreter and script paths in trial_command, so the command resolves the same way from every invocation.
  cwd: string | null = null

  # Which ambient variables the trainer inherits: none, a list of names added to what none keeps, or all of them.
  # none keeps only PATH, HOME, LANG, LC_ALL, TMPDIR, USER, LOGNAME and TZ when set, dropping PYTHONPATH, conda, HF_HOME, proxies and CUDA_VISIBLE_DEVICES.
  # A list's names are unique, nonempty, unpadded, free of = and NUL, and neither TMPDIR nor a passthrough_env name.
  # An empty list composes what none does but fingerprints differently.
  # Warning: a listed name's value is recorded with each trial. validate and run --dry-run warn about names with TOKEN, KEY, SECRET, PASSWORD or CREDENTIAL.
  inherit_env: "all" | "none" | list[string] = "none"

  # Ambient variables whose values may change between invocations, for example MLFLOW_TRACKING_TOKEN or HTTPS_PROXY. TMPDIR is built in.
  # Their names are fingerprinted, and their values are never recorded in the study ledger or compared. With inherit_env all, the list adds no variable.
  # Names follow the inherit_env list rules. They also reach PhaseSweep's MLflow and W&B workers, so they must exist in the controller's environment.
  # Recommended: put rotating credentials and proxy settings here, and PATH only when its differences are harmless, as with an absolute interpreter path.
  # Warning: model, data and cache settings that change what a trial means belong in env or inherit_env instead.
  passthrough_env: list[string] = []

  # Write the exact environment the trainer receives to an owner-only environment.json in each attempt directory, per-attempt and GPU variables included.
  # Its keys are digest (the cohort checksum), inherit_env and passthrough_env (their contracts), and env (the final mapping including run bindings).
  # Warning: true stores ambient and passed-through secrets in that file.
  record_env: bool = false

# ---------- Run deadline ----------

# Wallclock budget for one phasesweep run invocation, in seconds, >= 0. Its clock starts once the ledger is claimed and restarts at every invocation.
# It also caps W&B evidence reads and MLflow resolution, run creation and capture, but not MLflow result uploads.
# 0 fails the first phase before it starts, even a replay of finished work.
# See: docs/runtime.md#timeouts-cleanup-and-continuation
timeout_seconds_per_run: float | null = null

# ---------- Shared blocks ----------

JsonExtractor:
  # Variant json: read one number from a JSON file in the attempt directory. A null, boolean, string, container or non-finite number fails the read.
  type: "json" (required)

  # JSON file, for example result.json. The trainer finds the attempt directory through {trial_dir} or PHASESWEEP_TRIAL_DIR.
  path: string (required)

  # JSON key of the number, for example eval.loss. List indexes and keys that contain a dot cannot be addressed.
  key: string (required)

JsonEnvelopeExtractor:
  # Variant json_envelope: read an attempt-bound result envelope, as phasesweep.report_objective() writes it.
  # It must report schema_version 1, status complete, and the generation ID, attempt ID and overrides_sha256 PhaseSweep gave the attempt, or the read fails.
  # It also reports a nonempty evaluation.checkpoint, an integer evaluation.step >= 0 and a finite objective.value. Extra top-level keys are allowed.
  # See: docs/config.md#reporting-an-objective
  type: "json_envelope" (required)

  # Envelope file. report_objective() writes the metric.extractor path, exported as PHASESWEEP_OBJECTIVE_PATH only for a json_envelope metric.extractor.
  # A constraint's or observation's envelope at another path is the trainer's to write. At the same path it reads the metric's envelope.
  path: string = "result.json"

  # Exact nonempty objective.name the envelope must report, for example eval_loss.
  objective_name: string (required)

  # Exact nonempty objective.split the envelope must report, for example validation.
  split: string (required)

  # Exact nonempty evaluation.policy the envelope must report, for example final or best. It checks metadata and never selects a checkpoint.
  policy: string (required)

  # Exact nonempty evaluation.checkpoint the envelope must report. It never loads weights.
  checkpoint: string | null = null

  # Exact evaluation.step the envelope must report, an integer >= 0. It does not schedule evaluation.
  expected_step: int | null = null

  # Nonempty progress axis the sweep holds fixed, which the evaluation_point verdict compares. step is the envelope's own evaluation.step.
  # Any other name is read from evaluation.progress, and a missing position, or one that is not a finite number >= 0, fails the read.
  # Only used when: this is metric.extractor. A constraint or observation reader must leave it at its default, or config load fails.
  # Recommended: the axis the comparison holds fixed, such as tokens for a fixed-token sweep.
  # See: docs/config.md#training-length-comparison
  evaluation_axis: string = "step"

LogRegexExtractor:
  # Variant log_regex: extract numbers from a log file in the attempt directory with a regular expression.
  # A missing or unreadable file, a searched line that is not valid UTF-8, no numeric match, or a selected value that is not finite fails the read.
  type: "log_regex" (required)

  # Log file, for example stdout.log. stdout.log and stderr.log hold the trainer's two streams, and Python logging writes to stderr by default.
  file: string = "stdout.log"

  # Python regular expression whose named group (?P<value>...) captures the number, such as loss=(?P<value>[0-9.eE+-]+). Without that group, config load fails.
  # Lines split at \n, \r\n and bare \r and are searched one at a time, so a match cannot span lines. Inline flags such as (?i) work.
  # Each match in a line is one observation. float() parsing skips bad captures but accepts nan, inf and 1_0, so a loose capture can select a non-finite value.
  pattern: string (required)

  # Which observation is used: last or first by position in the file, min or max by value, the first of equal extremes. first decodes no line after its match.
  # Warning: with min or max a NaN capture is order dependent: a NaN seen first is never replaced, and a NaN seen after a number is ignored.
  select: "last" | "first" | "min" | "max" = "last"

# Requires: the top-level mlflow block.
# See: docs/mlflow.md#select-metrics-and-require-evidence
MlflowExtractor:
  # Variant mlflow: read the native unscoped metric history of the attempt's MLflow run once it has finished. A model- or dataset-scoped point fails the read.
  # A FAILED or KILLED run fails the read at once. Under run_mode managed, PhaseSweep finishes a run still running after the trainer exits and reads it.
  # Under run_mode trainer, a run that has not finished is polled until mlflow.timeout_seconds runs out.
  type: "mlflow" (required)

  # Exact nonempty metric name as the trainer logs it, for example eval_loss or eval/loss, with no alias, summary fallback or fuzzy match.
  # A metric missing from a finished run fails the trial at once, naming it and listing the run's metric keys.
  metric_key: string (required)

  # Which point of the metric history is used: last, min, max, or the point at step. It must be finite, and its step is the evaluation_point position.
  # Requires: step set exactly when select is step.
  select: "last" | "min" | "max" | "step" (required)

  # Exact history step to read, an integer >= 0, in the units of the trainer's logged step counter.
  step: int | null = null

WandbExtractor:
  # Variant wandb: read one finite number from the finished summary of the W&B run PhaseSweep manages for this attempt, <entity>/<project>/<attempt ID>.
  # The trainer must log to that run under the managed WANDB_RUN_ID and finish it.
  # See: docs/config.md#wb-evidence
  type: "wandb" (required)
  <<: WandbTarget

  # Exact nonempty key in the finished summary, for example eval/loss, or eval/loss.min for a define_metric summary=min aggregate.
  # A bare key never stands in for its aggregate.
  # Warning: a metric_key missing from the finished summary is polled up to 30 more seconds, then fails the read, so a misspelled key costs that every trial.
  metric_key: string (required)

  # Nonempty history key logged with metric_key that marks where it was measured, for example eval/step or tokens. _step is W&B's own step.
  # Log it in the same log() call. It may be neither metric_key nor, for a dotted metric_key, the text before its last dot.
  # An aggregate key such as eval/loss.min is positioned at the end of its history series.
  # Only used when: this is metric.extractor, as for the json_envelope evaluation_axis.
  evaluation_axis: string = "_step"

# The W&B target and polling fields of the wandb reader and the wandb_summary_required gate. Within a phase, every W&B reader and gate agrees on all five.
# A run that ends failed, crashed, killed or preempted fails the read at once, and one that has not finished is polled until timeout_seconds runs out.
# Requires: the phasesweep[wandb] extra, and a trainer that honors the managed WANDB_* variables, including WANDB_RESUME never, and finishes its run.
# Requires: env.WANDB_BASE_URL, WANDB_ENTITY and WANDB_PROJECT, when set, match the target, env.WANDB_RESUME, when set, is never, and env has no WANDB_RUN_ID.
# Requires: no WANDB_MODE of offline, dryrun or disabled and no WANDB_DISABLED of 1, true, yes or on, in any case, in env or, at launch, inherited.
WandbTarget:
  # W&B API endpoint: an http or https URL with a host. Scheme and host are lowercased and trailing slashes stripped. Credentials, a query or a fragment fail.
  base_url: string = "https://api.wandb.ai"

  # W&B account or team, for example research-team: nonempty, without slash or whitespace. The trainer environment's credentials must be able to read it.
  entity: string (required)

  # W&B project, for example bart-search: nonempty, without slash or whitespace.
  project: string (required)

  # Seconds between polls of the run state and summary, greater than 0.
  poll_seconds: float = 2.0

  # Seconds one attempt may spend capturing the finished summary, at least 1, worker startup, SDK calls and polling included. Phase and run deadlines cap it too.
  # After the objective is accepted, locating its history position gets a fresh budget of this length, capped by the same deadlines.
  # History has up to 30 seconds of that to catch up with the summary, and reading it may use the rest.
  # A capture that runs out fails the read. A position lookup that runs out only leaves the position unrecorded.
  timeout_seconds: float = 120.0

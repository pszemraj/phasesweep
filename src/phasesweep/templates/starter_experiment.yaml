# Runnable PhaseSweep starter. The human owns this file: review trainer commands,
# paths, search spaces, and permissions before launching real workloads.
experiment: phasesweep_starter
storage: __PHASESWEEP_STORAGE__
provenance:
  revision: "phasesweep-starter-v1"
workdir: __PHASESWEEP_WORKDIR__

# This trainer ships inside the installed PhaseSweep package. Replace it with
# your own command after the local smoke test.
trial_command: "python -m phasesweep.examples.fake_train --out {trial_dir}/result.json {overrides}"
override_format: argparse

metric:
  name: eval_loss
  goal: minimize
  extractor:
    type: json_envelope
    path: result.json
    objective_name: eval_loss
    split: validation
    policy: synthetic
    checkpoint: toy_formula
    expected_step: 100

phases:
  - name: depth
    comment: "Compare two model depths before tuning the learning rate."
    n_trials: 2
    sampler: { type: grid }
    search_space:
      n_layers: { type: categorical, choices: [6, 8] }

  - name: learning_rate
    comment: "Keep the winning depth fixed and compare two learning rates."
    inherits: [depth]
    n_trials: 2
    sampler: { type: grid }
    search_space:
      lr: { type: categorical, choices: [0.0001, 0.0003] }

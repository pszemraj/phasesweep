# phasesweep template: eight log-spaced learning rates, one trial each, for a noisy objective, with a metric bound and observe
# Details on any key: phasesweep explain <key>, e.g. phasesweep explain 'phases[].sampler'
#
# When one run's metric moves with the seed, the cheapest way to see past the noise is more distinct
# values, not repeats. This template tries eight learning rates spaced evenly on a log scale, one
# trial each. Neighboring rates act as replicates: noise shows as scatter around the trend, and the
# best rate is where the trend bottoms out. Read the trend with phasesweep status CONFIG --trials
# or in trials.csv. A winner that is an isolated dip among clearly worse neighbors is likely noise,
# and the trend is the better guide. Background: the "Noisy objectives and small budgets" section of
# https://github.com/pszemraj/phasesweep/blob/main/docs/config.md#noisy-objectives-and-small-budgets
#
# It runs as written on the packaged toy trainer, which adds seed noise when its config carries a
# seed, so trainer_config pins seed 1. For your own trainer, replace trial_command, the
# trainer_config keys, the metric extractor, the observe entry and the bound.
experiment: phasesweep_noisy
storage: auto
provenance:
  revision: "phasesweep-noisy-v1"
# Relative paths here resolve against this file's directory, not the shell's.
workdir: ./runs
execution:
  # Pins the trainer's cwd to this file's directory: a run from another directory resumes
  # the same study. Unset, the cwd follows the invocation directory and is fingerprinted.
  cwd: .
  # none: the trainer sees only a minimal environment. See phasesweep explain execution.inherit_env.
  inherit_env: none

trial_command: "python -m phasesweep.examples.fake_train --config {config_path}"

trainer_config:
  # One fixed seed for every trial. Each learning rate still draws its own noise from the toy
  # trainer, so the scatter around the trend is visible.
  seed: 1
  model:
    n_layers: 8
    dropout: 0.1
  optimizer:
    lr: 0.0003
    weight_decay: 0.05

metric:
  name: eval_loss
  goal: minimize
  # Viability bound: a loss above this means the run diverged. A trial outside the bound completes
  # with its real value but cannot win, so a diverged run never ranks. Set it above the loss of
  # ordinary runs, which the trial table shows.
  max: 0.6
  extractor:
    type: json_envelope
    path: result.json
    objective_name: eval_loss
    split: validation
    policy: synthetic
    checkpoint: toy_formula
    expected_step: 100

# Report-only values: recorded per trial and in the winner, never used to rank. The toy trainer
# writes param_bytes next to the objective in result.json. Read yours with a json extractor.
observe:
  - name: param_bytes
    extractor: { type: json, path: result.json, key: param_bytes }

phases:
  - name: learning_rate
    comment: "Eight learning rates evenly spaced on a log scale, one trial each; read the trend across them."
    # Eight values and eight trials: a grid runs every value once. Grid takes explicit values, so
    # the log spacing is in the list (each value is about 1.39 times the one before it). For a
    # range instead, a seeded random phase over a float with log: true draws values evenly across
    # orders of magnitude. More values give a clearer trend, at one trial each.
    n_trials: 8
    sampler: { type: grid }
    search_space:
      optimizer.lr:
        type: categorical
        choices: [0.0001, 0.00014, 0.0002, 0.00027, 0.00037, 0.00052, 0.00072, 0.001]
